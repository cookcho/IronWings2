      else if(it.k==='O'){                    /* 호위기 */
        if(wings.length<4&&addWing()){
          setBanner('호위기 합류!','같이 싸워준다'); bannerT=80;
          ring(player.x,player.y,70,'rgba(140,225,255,.8)',3,20); haptic(HAP.item,2);
        } else addScore(2500);
      }
      else if(it.k==='F'){                    /* 변신 — 6초간 초강화 형태 */
        const was=odT>0;
        odT=Math.min(OD_MAX+80,odT+OD_MAX);
        setBanner(was?'변신 연장!':'변 신!','4초간 무적 · 초화력'); bannerT=80;
        if(!was){
          slowT=Math.max(slowT,18); flash=34; flashCol='255,214,140';
          shake=Math.max(shake,12);
          for(let r2=0;r2<3;r2++) later(r2*5,()=>{ if(state==='play')
            ring(player.x,player.y,46+r2*30,'rgba(255,196,110,'+(.9-r2*.22)+')',3.4-r2*.6,20); });
          for(let i=0;i<22;i++){ const a2=i/22*TAU;
            spark(player.x+Math.cos(a2)*26,player.y+Math.sin(a2)*26,2,'#ffe6a8'); }
          boom(player.x,player.y,14,'#ffd58a',3.4,1.1);
          haptic(HAP.bomb,5);
        } else { ring(player.x,player.y,70,'rgba(255,196,110,.8)',3,18); haptic(HAP.item,2); }
      }
      else if(it.k==='T'){                    /* 시간 지연 — 5초간 적탄 감속 */
        slowfT=Math.min(480,slowfT+300);
        setBanner('시간 지연!','적 탄이 느려진다'); bannerT=70;
        ring(player.x,player.y,90,'rgba(150,220,255,.85)',3.4,26);
        haptic(HAP.item,2); flash=14; flashCol='170,220,255';
      }
      else if(it.k==='S'){
        const v=Math.round(2000*(1+(stageNo-1)*.28));
        addScore(v); addExp(10); popText(it.x,it.y-12,'+'+v,'#ffe27a');
        ring(it.x,it.y,44,'rgba(255,226,122,.8)',2.4,18);
      }
      else if(it.k==='M'){
        const v=Math.round(9000*(1+(stageNo-1)*.28));
        addScore(v); addExp(40); runMedal+=8;
        popText(it.x,it.y-14,'+'+v,'#ffd24a');
        popText(it.x,it.y+6,'훈장!','#fff3c8');
        ring(it.x,it.y,80,'rgba(255,210,74,.85)',3.4,26);
        flash=Math.max(flash,14); flashCol='255,230,150';
        sfx.stage();
      }
      else if(it.k==='H'){
        if(hp<maxHP()){ hp=Math.min(maxHP(),hp+2); popText(it.x,it.y-12,'수리','#7bf09a'); }
        else addScore(800);
      }
      else if(it.k==='L'){ hp=maxHP(); lives=Math.min(5,lives+1);
             popText(it.x,it.y-14,'예비기 +1','#ff9ab0'); }
      else addScore(500);
      if(it.k!=='M') sfx.item();
      boom(it.x,it.y,8,it.k==='S'||it.k==='M'?'#ffe27a':'#a9e8ff',2);
      items.splice(i,1);
    }
  }
}

/* ---------- 보스 판정/행동 ---------- */
function bossBox(){
  if(boss.mid&&MIDBOX[boss.type]){
    const k=boss.scale||1, b=MIDBOX[boss.type]; return [b[0]*k,b[1]*k];
  }
  const t=boss.type, k=boss.scale||1;
  if(t==='bomber') return [72*k,26*k];
  if(t==='wing')   return [80*k,24*k];
  if(t==='ship')     return [52*k,90*k];
  if(t==='overlord')   return [104*k,70*k];
  if(t==='fortress')   return [70*k,52*k];
  if(t==='zeppelin')   return [30*k,86*k];
  if(t==='seaplane')   return [84*k,28*k];
  if(t==='armortrain') return [26*k,104*k];
  return [58*k,26*k];
}
function hitBoss(b){
  const [bw,bh]=bossBox();
  if(b.pierce&&b.hit&&b.hit['B']) return false;
  if(Math.abs(b.x-boss.x)<bw&&Math.abs(b.y-boss.y)<bh){
    boss.hp-=b.dmg*(b.bossMul||1); spark(b.x,b.y,6,'#fffbe6');
    if((boss.hitCd=(boss.hitCd||0)-1)<=0){ boss.hit=3; boss.hitCd=26; }  /* 간헐 발광 */
    ring(b.x,b.y,16,'rgba(255,240,190,.8)',2,8);
    if(clankT<=0){ sfx.clank(); clankT=4; }
    if(b.dmg>=4&&clankT>3) sfx.crunch();
    if(b.pierce&&b.hit) b.hit['B']=1;
    return true;
  }
  return false;
}
function updateBoss(dt){
  const b=boss; b.t+=dt; if(b.hit>0) b.hit-=dt; if(b.flashT>0) b.flashT-=dt;
  const ty = b.mid?112:({overlord:118,ship:150,fortress:128,zeppelin:118,armortrain:158,seaplane:96}[b.type]||100);
  if(b.entering){ b.y+=1.2*dt; if(b.y>=ty){ b.y=ty; b.entering=0;
    if(!b.mid) setBanner('보스전',''); } }
  else {
    /* 이동 */
    if(b.type==='ace'&&b.dash>0){ b.dash-=dt; b.x+=b.dir*4.2*dt;
      if(b.x<50||b.x>W-50){ b.dir*=-1; } }
    else {
      const mg=Math.min(W/2-14,bossBox()[0]*.62);
      const slow=(b.type==='ship'||b.type==='armortrain'||b.type==='zeppelin');
      b.x+=b.dir*(slow?.55:1.0)*(b.hp<b.max*.5?1.35:1)*dt;
      if(b.x<mg){b.x=mg;b.dir=1;} if(b.x>W-mg){b.x=W-mg;b.dir=-1;}
      b.y=ty+Math.sin(b.t*.018)*(b.type==='ship'?6:12);
    }
    /* 공격 */
    b.atkT-=dt;
    if(b.atkT<=0){ doBossAttack(); }
    if(b.type==='wing') b.beamT-=dt;
  }
  /* 보스전에도 호위 편대가 계속 투입된다 */
  b.mobT-=dt;
  if(b.mobT<=0&&!b.entering){
    b.mobT=clamp(340-stageNo*18,165,340);
    if(enemies.length<10) spawnWave(true);
  }
  /* 보스전 보급 — 약할수록 자주 내려온다 */
  b.itemT-=dt;
  if(b.itemT<=0){
    const weak = cardLv<4;
    b.itemT = power>=5 ? 430 : weak ? 175 : 290;
    let k;
    k = Math.random()<.42?'B':(Math.random()<.62?'S':(power<5?'P':'S'));
    if(weak&&Math.random()<.12) k='H';
    if(weak&&Math.random()<.03) k='L';
    if(wings.length<4&&Math.random()<.22) k='O';
    else if(Math.random()<.20) k=Math.random()<.5?'F':'T';   /* 보스전 보급 */
    items.push({x:rnd(40,W-40),y:-20,vy:1.05,k,t:0});
    popText(W/2,60,'보급','#8fe3ff');
  }
  const hpr=b.hp/b.max, bb=bossBox();
  if(hpr<.75&&Math.random()<(.78-hpr)*1.9*dt)
    smoke(b.x+rnd(-bb[0]*.8,bb[0]*.8),b.y+rnd(-bb[1]*.6,bb[1]*.6),1,'rgba(56,52,48,.62)');
  if(hpr<.45&&Math.random()<(.5-hpr)*2.4*dt)
    boom(b.x+rnd(-bb[0]*.7,bb[0]*.7),b.y+rnd(-bb[1]*.5,bb[1]*.5),2,'#ff8a3c',2.2);
  if(hpr<.22&&Math.random()<.055*dt){        /* 내부 유폭 */
    const ex=b.x+rnd(-bb[0]*.6,bb[0]*.6), ey=b.y+rnd(-bb[1]*.5,bb[1]*.5);
    bigBoom(ex,ey,.7,'#ffb14d'); sfx.pop(); shake=Math.max(shake,6);
  }
  if(Math.random()<.12*dt) boom(b.x+rnd(-40,40),b.y+rnd(-12,12),1,'#ffd9a0',1);

  /* 접촉 */
  const [bw,bh]=bossBox();
  if(invT<=0&&Math.abs(b.x-player.x)<bw-8&&Math.abs(b.y-player.y)<bh-6) hurt(1);

  /* 격추 */
  if(b.hp<=0){
    const mid=b.mid?1:0;
    addScore(mid?(1200+stageNo*500):(3000+stageNo*1200));
    addExp(mid?60:150); sfx.bossdie(); haptic(mid?HAP.midboss:HAP.boss,mid?5:6);
    flash=40; flashCol='255,230,180'; shake=32; slowT=42;
    for(let k=0;k<10;k++) later(k*4,()=>{
      bigBoom(b.x+rnd(-80,80),b.y+rnd(-36,36),1.5+rnd(0,.6));
      if(k%3===0) sfx.pop();
    });
    bigBoom(b.x,b.y,3.2,'#fff2c8');
    ring(b.x,b.y,W*1.5,'rgba(255,220,150,.8)',6,34);
    popText(b.x,b.y-30,'+'+(mid?(1200+stageNo*500):(3000+stageNo*1200)),'#ffd24a');
    smoke(b.x,b.y,24,'rgba(50,50,50,.6)');
    if(mid){
      items.push({x:b.x-20,y:b.y,vy:1,k:power<5?'P':'S',t:0});
      items.push({x:b.x+20,y:b.y,vy:1,k:Math.random()<.75?'H':'B',t:0});
    } else {
      items.push({x:b.x-56,y:b.y,vy:1,k:'P',t:0});
      items.push({x:b.x-18,y:b.y,vy:1,k:'H',t:0});                     /* 수리는 항상 지급 */
      if(Math.random()<.16) items.push({x:b.x,y:b.y-24,vy:1,k:'L',t:0}); /* 예비기는 가끔 */
      items.push({x:b.x+18,y:b.y,vy:1,k:wings.length<4?'O':(Math.random()<.5?'F':'T'),t:0});
      items.push({x:b.x+56,y:b.y,vy:1,k:'M',t:0});
    }
    bombs=Math.min(D.bombs+3+(mods.bomb||0),bombs+1); updBomb();
    const wasMid=b.mid;
    boss=null; ebullets.length=0; beams.length=0;
    if(wasMid){                            /* 중간 보스는 스테이지를 끝내지 않는다 */
      runMedal+=4; popText(W/2,H/2-30,'훈장 +4','#ffd24a');
      return;
    }
    enemies.length=0;
    setBanner('스테이지 '+stageNo+' 완료','강화를 고르세요'); bannerT=90;
    later(56,()=>{ if(state==='play') openCards(); });
  }
}
function doBossAttack(){
  const b=boss, hard=Math.min(stageNo,8);
  if(!bulletRoom(1.5)){ b.atkT=28; return; }    /* 보스도 과포화면 한 박자 쉰다 */
  b.flashT=13;
  const px=player.x, py=player.y;
  const aim=Math.atan2(py-b.y,px-b.x);
  /* 체력 절반 아래면 2단계: 더 빠르고 탄이 늘어난다 */
  const rush=(b.hp<b.max*.5?.62:1)*Math.max(.55,1-(stageNo-1)*.05);
  const more=Math.max(0,Math.floor(Math.min(stageNo-1,6)/2)+D.sp);
  if(b.type==='overlord'){                 /* 왕 보스 — 4종 패턴, 후반 2단계 */
    const p2=b.hp<b.max*.5;
    b.atk=(b.atk+1)%(p2?4:3);
    if(b.atk===0){                       /* 주포 3문 일제 사격 */
      for(const ox of [-24,0,24]) later(Math.abs(ox)/6,()=>{ if(boss===b&&state==='play'){
        for(let k=-2-more;k<=2+more;k++) eshot(b.x+ox,b.y+34,aim+k*.13,2.0); } });
      b.atkT=140*rush; sfx.cannon();
    } else if(b.atk===1){                /* 좌우 부포 교차 탄막 */
      for(let w2=0;w2<5;w2++) later(w2*7,()=>{ if(boss===b&&state==='play'){
        for(const sg of [-1,1]) eshot(b.x+sg*34,b.y+12,PI/2+sg*(.22-w2*.08),2.3,'tracer'); } });
      b.atkT=135*rush;
    } else if(b.atk===2){                /* 코어 방출 — 이중 회전 링 */
      for(let r2=0;r2<2;r2++) later(r2*16,()=>{ if(boss===b&&state==='play'){
        const n=14+hard; for(let k=0;k<n;k++) eshot(b.x,b.y+8,k/n*TAU+r2*.22+b.t*.01,1.7); } });
      b.atkT=150*rush;
    } else {                             /* 2단계 전용 — 폭격 + 추격탄 */
      for(let w2=0;w2<3;w2++) later(w2*12,()=>{ if(boss===b&&state==='play'){
        ebullets.push({x:b.x+rnd(-40,40),y:b.y+40,vx:rnd(-.3,.3),vy:1.1,t:0,type:'bomb'});
        eshot(b.x,b.y+34,Math.atan2(player.y-b.y,player.x-b.x),2.5,'tracer'); } });
      b.atkT=145*rush; sfx.cannon();
    }
  } else if(b.mid&&MIDBOX[b.type]){
    b.atk=(b.atk+1)%3;
    if(b.type==='gyro'){                    /* 회전익 — 조준 연발 + 하강 기류 */
      if(b.atk===0){
        for(let w2=0;w2<3;w2++) later(w2*9,()=>{ if(boss===b&&state==='play'){
          const a2=Math.atan2(player.y-b.y,player.x-b.x);
          for(const sg of [-1,1]) eshot(b.x+sg*20,b.y+24,a2+sg*.08,2.2,'tracer'); } });
        b.atkT=110;
      } else if(b.atk===1){
        const n=10+hard; for(let k=0;k<n;k++) eshot(b.x,b.y,k/n*TAU+b.t*.02,1.6);
        b.atkT=130;
      } else {
        for(let k=-2-more;k<=2+more;k++) eshot(b.x,b.y+24,aim+k*.17,2.0);
        b.atkT=120;
      }
    } else if(b.type==='drone'){            /* 드론 모함 — 요격기 사출 */
      if(b.atk===0){
        for(const sg of [-1,1]) enemies.push(mkEnemy(stageNo>=6?'jet':'bf',
          b.x+sg*46,b.y+18,{mode:'dive'}));
        b.atkT=150; sfx.cannon();
      } else if(b.atk===1){
        for(let r2=0;r2<2;r2++) later(r2*14,()=>{ if(boss===b&&state==='play'){
          const n=9+hard; for(let k=0;k<n;k++) eshot(b.x,b.y,k/n*TAU+r2*.3,1.7); } });
        b.atkT=145;
      } else {
        for(let k=-3-more;k<=3+more;k++) eshot(b.x,b.y+16,aim+k*.14,2.1,'tracer');
        b.atkT=115;
      }
    } else if(b.type==='crawler'){          /* 크롤러 — 쌍포탑 포격 */
      if(b.atk===0){
        for(const sg of [-1,1])
          ebullets.push({x:b.x+sg*13,y:b.y+30,vx:sg*.4,vy:2.2,t:0,type:'shell',
            fuse:Math.max(18,(py-b.y-30)/2.2)});
        b.atkT=130; sfx.cannon();
      } else if(b.atk===1){
        for(let w2=0;w2<4;w2++) later(w2*8,()=>{ if(boss===b&&state==='play')

      }
    } else if(b.type==='miner'){            /* 기뢰 부설함 */
      if(b.atk===0){
        for(const ox of [-13,0,13])
          ebullets.push({x:b.x+ox,y:b.y+40,vx:rnd(-.2,.2),vy:.85,t:0,type:'bomb'});
        b.atkT=115; sfx.cannon();
      } else if(b.atk===1){
        const n=12+hard; for(let k=0;k<n;k++) eshot(b.x,b.y,k/n*TAU,1.5);
        b.atkT=135;
      } else {
        for(let w2=0;w2<3;w2++) later(w2*11,()=>{ if(boss===b&&state==='play')
          eshot(b.x,b.y+30,Math.atan2(player.y-b.y,player.x-b.x),2.0); });
        b.atkT=120;
      }
    } else {                                /* proto — 고속 돌진 */
      if(b.atk===0){
        for(let k=-2-more;k<=2+more;k++) eshot(b.x,b.y+20,aim+k*.12,2.6,'tracer');
        b.atkT=100;
      } else if(b.atk===1){
        b.dash=80;
        for(let w2=0;w2<5;w2++) later(w2*8,()=>{ if(boss===b&&state==='play')
          eshot(b.x,b.y+20,PI/2+rnd(-.28,.28),2.3,'tracer'); });
        b.atkT=125;
      } else {
        for(let k=0;k<12;k++) later(k*4,()=>{ if(boss===b&&state==='play')
          eshot(b.x,b.y+14,k*.52+b.t*.012,1.9); });
        b.atkT=150;
      }
    }
  } else if(b.type==='bomber'){

    } else { /* 엔진 대공 링 */

    }
  } else if(b.type==='wing'){

      for(let k=0;k<n;k++) eshot(b.x,b.y,k/n*TAU+b.t*.01,1.7);

/* ===== 미리 그려 두고 도장처럼 찍기 =====
   탄 하나를 그릴 때마다 서너 겹을 따로 칠하면 느린 기기가 버겁다.
   같은 그림은 한 번만 그려 두고 drawImage 한 번으로 찍는다.
   RS 배로 떠 두므로 화면에 1:1 로 맞아 선명도는 그대로다. */
const SPR=new Map();
function sprite(key,w,h,draw){
  let s=SPR.get(key); if(s) return s;
  const c=document.createElement('canvas');
  c.width=Math.ceil(w*RS); c.height=Math.ceil(h*RS);
  const g=c.getContext('2d');
  g.imageSmoothingEnabled=false;
  g.setTransform(RS,0,0,RS,0,0);
  g.translate(w/2,h/2);
  const old=ctx; ctx=g;
  try{ draw(); } finally { ctx=old; }
  s={c,w,h}; SPR.set(key,s); return s;
}
function stamp(s,x,y){ ctx.drawImage(s.c, x-s.w/2, y-s.h/2, s.w, s.h); }
function poly(pts){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]);
  for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]); ctx.closePath(); ctx.fill(); }
function polyLine(pts){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]);
  for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]); ctx.closePath(); ctx.stroke(); }
function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath(); ctx.fill();
}
/* 파편 상한 — 느린 기기에서는 적게 둔다.

  const fz=.60+.40*Math.sin(time*(jet?.55:.42)+(ph||0));

/* 회전 프로펠러 — 둥근 사각형을 12개나 그린다.

function nprop(y,r,a){
  const P=TAU/3, STEP=6;
  const q=Math.floor((((a%P)+P)%P)/P*STEP)%STEP;

function _nprop(y,r,a){                   /* 엔진 나셀 프로펠러 — 직선 블레이드 */

function _mix(hex,f){                    /* f>0 밝게, f<0 어둡게 */
  if(typeof hex!=='string'||hex[0]!=='#') return hex;
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if(f>=0){ r+=(255-r)*f; g+=(255-g)*f; b+=(255-b)*f; }
  else    { r*=(1+f); g*=(1+f); b*=(1+f); }
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}

let _tint=null;
function _tintCol(hex,t){
  if(!t||typeof hex!=='string'||hex[0]!=='#'||hex.length!==7) return hex;
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  let L=(r*.299+g*.587+b*.114)/255;
  L=clamp((L-.42)*1.55+.38,0,1);          /* 명암 대비를 키운다 */
  const k=t.s;
  r=clamp(Math.round(r*(1-k)+t.r*L*k*1.78),0,255);
  g=clamp(Math.round(g*(1-k)+t.g*L*k*1.78),0,255);
  b=clamp(Math.round(b*(1-k)+t.b*L*k*1.78),0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function shade(w,h,c1,c2){               /* 좌상단 광원의 둥근 금속 표면 */
  if(_tint){ c1=_tintCol(c1,_tint); c2=_tintCol(c2,_tint); }
  const key=(_tint?_tint.id:'')+'|'+w+'|'+c1+'|'+c2;
  const hit=_gcache.get(key); if(hit) return hit;
  const g=ctx.createLinearGradient(-w,0,w,0);
  g.addColorStop(0,   _mix(c2,-.34));
  g.addColorStop(.13, c2);
  g.addColorStop(.32, _mix(c1,.30));
  g.addColorStop(.50, c1);
  g.addColorStop(.74, _mix(c2,.05));
  g.addColorStop(.92, _mix(c2,-.20));
  g.addColorStop(1,   _mix(c1,.22));     /* 오른쪽 가장자리 반사광 */
  if(_gcache.size<200) _gcache.set(key,g);
  return g;
}

let BFLIP=0;
let _flashPass=0;
/* 실루엣 그림자 패스 — 지금은 쓰지 않는다.
   기체를 한 번 더 그려 검게 찍는 방식은 ctx.filter 가 필요한데,
   매 프레임 쓰기엔 너무 느려 화면이 멈춘다 */
let _shadowPass=0;
function drawBoss(){
  const b0=boss;
  /* ===== 실루엣 그림자와 테두리 빛 =====
     기체를 통째로 한 번 더 그리되 위치를 비껴 둔다. 본체를 그 위에 덮으면
     비껴난 테두리만 남는다 — 모양이 정확히 맞는 그림자와 반사가 공짜로 생긴다.
     ctx.filter 로 검게 칠하는 방법은 너무 느려 화면이 멈췄고,
     multiply 로 겹치면 필터 없이 같은 효과를 낸다. */
  if(b0){                                 /* 타원 세 겹은 값이 싸서 늘 그린다 */
    /* 보스는 포신과 날개가 많아, 본체를 통째로 검게 복제하면
       바닥에 검은 덩어리가 생긴다. 잡몹과 달리 부드러운 타원 하나로 받친다. */
    const [bw,bh]=bossBox();
    ctx.save();
    ctx.globalCompositeOperation='multiply';
    const gx=b0.x+clamp(bw*.09,4,12), gy=b0.y+clamp(bh*.13,5,15);
    for(let i=3;i>=1;i--){                 /* 세 겹을 포개 가장자리를 흐린다 */
      ctx.globalAlpha=.13;
      ctx.fillStyle='#140f0a';
      ctx.beginPath();
      ctx.ellipse(gx,gy,bw*(.30+i*.055),bh*(.26+i*.05),0,0,TAU);
      ctx.fill();
    }
    ctx.restore(); _tint=null;
  }
  _flashPass=0; drawBossBody(); _tint=null;
  const b=boss;
  if(b&&b.hit>1&&b.hitCd>18){
    ctx.save();
    ctx.globalAlpha=clamp(b.hit/6,0,1)*.17;   /* 은은하게만 밝아진다 */
    ctx.globalCompositeOperation='lighter';
    _flashPass=1; drawBossBody(); _flashPass=0; _tint=null;
    ctx.restore();
  }
}

function propW(p){ return (PROPDEF[p.kind]||PROPDEF.tank).w; }
function propH(p){ return (PROPDEF[p.kind]||PROPDEF.tank).h; }
function wake(w,l,t){        /* 함선 항적 — 뱃머리 포말 덩어리와 선미 물거품 */
  ctx.save();
  /* 뱃머리: 좌우로 밀려나는 부드러운 포말 (선이 아니라 덩어리) */
  for(let i=0;i<3;i++){
    const ph=t*.05+i*.9, sp=.9+Math.sin(ph)*.12;
    ctx.globalAlpha=.13-i*.03;
    ctx.fillStyle='#ffffff';
    for(const sg of [-1,1]){
      ctx.beginPath();
      ctx.ellipse(sg*(w*.55+i*w*.42)*sp, -l+2-i*4.5,
                  w*(.52-i*.10), 3.4-i*.6, sg*.42, 0, TAU);
      ctx.fill();
    }
  }
  /* 선미: 뒤로 흘러가며 퍼지는 물거품 */
  for(let i=0;i<6;i++){
    const o=(t*.8+i*11)%52, a=.16*(1-o/52);
    ctx.globalAlpha=a; ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.ellipse(Math.sin(t*.06+i*1.7)*w*.42, l+1+o,
                w*(.55+o*.010), 2.8-o*.028, 0,0,TAU);
    ctx.fill();
  }
  ctx.restore();
}
function deck(w,l,col){
  ctx.fillStyle=col; ctx.fillRect(-w,-l,w*2,l*2);
  ctx.strokeStyle='rgba(50,45,35,.4)'; ctx.lineWidth=.7;
  for(let y=-l+4;y<l;y+=6){ ctx.beginPath(); ctx.moveTo(-w,y); ctx.lineTo(w,y); ctx.stroke(); }
}
function turretAt(x,y,r,ln){

/* 목표물 공용 마감 — 갑판 널·림 라이트·외곽선으로 또렷하게 */
function propSkin(w,h,cx,cy,acc,outline){
  /* 격자는 실루엣이 주어진 경우에만 — 기체 밖으로 새어 나오지 않게 */
  if(outline){
    ctx.save(); ctx.beginPath();
    for(let i=0;i<outline.length;i+=2){ i?ctx.lineTo(outline[i],outline[i+1]):ctx.moveTo(outline[i],outline[i+1]); }
    ctx.closePath(); ctx.clip();
    panelLines(-w/2,-h/2,w,h,cx||3,cy||6);
    ctx.restore();
  }
  if(outline){
    ctx.save(); ctx.beginPath();
    for(let i=0;i<outline.length;i+=2){ i?ctx.lineTo(outline[i],outline[i+1]):ctx.moveTo(outline[i],outline[i+1]); }
    ctx.closePath(); ctx.clip();
    ctx.strokeStyle='rgba(6,9,14,.9)'; ctx.lineWidth=3.4;
    ctx.beginPath();
    for(let i=0;i<outline.length;i+=2){ i?ctx.lineTo(outline[i],outline[i+1]):ctx.moveTo(outline[i],outline[i+1]); }
    ctx.closePath(); ctx.stroke(); ctx.restore();
    rimLight(outline,'rgba(255,255,255,.30)',1.6);
  }
  if(acc){                                   /* 식별 도장 — 선체 안쪽 */
    ctx.fillStyle=acc;
    rr(-w*.24,-h*.26,w*.48,h*.028,1);
    rr(-w*.24, h*.22,w*.48,h*.028,1);
  }
  bolts(-w*.22,-h*.34,w*.22,-h*.34,4);
  bolts(-w*.22, h*.34,w*.22, h*.34,4);
}

}

function drawBullets(){
  for(const b of bullets){
    const k=b.bs||1;
    if(k>1){ ctx.save(); ctx.translate(b.x,b.y); ctx.scale(k,k); ctx.translate(-b.x,-b.y); }
    if(b.type==='v'){
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx)+PI/2);
      ctx.fillStyle='rgba(255,230,120,.5)'; rr(-2.6,-9,5.2,15,2.6);
      ctx.fillStyle='#fffbe6'; rr(-1.2,-7,2.4,10,1.2);
      ctx.restore();
    } else if(b.type==='sp'){          /* 분열 파편 — 내 것임이 분명한 청백색 */
      const f=clamp((b.ttl||26)/26,0,1);
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx)+PI/2);
      ctx.globalAlpha=.35+.65*f;
      ctx.fillStyle='rgba(120,235,255,.5)'; rr(-2.2,-7,4.4,11,2.2);
      ctx.fillStyle='#eafcff'; poly([0,-8, 1.8,-2, 0,5, -1.8,-2]);
      ctx.globalAlpha=1; ctx.restore();
    } else if(b.type==='p'){

      ctx.fillStyle='rgba(120,215,255,.55)'; rr(b.x-4,b.y-12,8,21,4);
      ctx.fillStyle='#f2ffff'; rr(b.x-1.6,b.y-9,3.2,14,1.6); ctx.restore();
    } else if(b.type==='l'){
      ctx.save(); ctx.shadowColor='rgba(190,120,255,.9)'; ctx.shadowBlur=10;
      const kw=b.wide?1.5:1;
      ctx.fillStyle='rgba(200,140,255,.45)'; rr(b.x-3.5*kw,b.y-22,7*kw,40,3.5);

function drawOrbs(){
  const n=mods.orbit||0; if(!n) return;
  for(let i=0;i<n;i++){
    const a=time*.052+i*TAU/n, R=52;
    const ox=player.x+Math.cos(a)*R, oy=player.y+Math.sin(a)*R;
    ctx.fillStyle='rgba(255,210,122,.28)';

    ctx.fillStyle='#ffd27a'; ctx.beginPath(); ctx.arc(ox,oy,6,0,TAU); ctx.fill();
    ctx.fillStyle='#fff6d8'; ctx.beginPath(); ctx.arc(ox-1.4,oy-1.4,2.6,0,TAU); ctx.fill();
  }
}

function scrollDraw(img,off){          /* 잘라 그려서 화면 1장 분량만 합성.
                                         타일이 화면보다 길 수 있다.
     잘라낼 범위는 '그림의 실제 픽셀' 단위이므로 구워진 배율 k 를 곱한다.
     정수 픽셀에 맞춰 잘라야 확대할 때 가장자리가 흔들리지 않는다 */
  const k=img.width/W, ih=img.height, sh=Math.round(H*k);
  const o=((Math.round(off*k)%ih)+ih)%ih;
  const s0=((ih-o)%ih+ih)%ih;           /* 화면 맨 위에 올 타일의 행 */
  const first=Math.min(sh,ih-s0);
  ctx.drawImage(img,0,s0,img.width,first, 0,0,W,first/k);
  if(first<sh) ctx.drawImage(img,0,0,img.width,sh-first, 0,first/k,W,(sh-first)/k);
}
function drawSky(){
  if(terrain){
    /* 두 장 모두 같은 속도로 흘린다. det 를 더 빠르게 흘리면
       나무와 건물이 땅 위를 미끄러진다 — 땅에 붙은 것은 땅과 같이 움직여야 한다.
       화면에서 따로 흐르는 것은 구름뿐이다 */
    scrollDraw(terrain.base,scGnd);      /* 대기 헤이즈는 지형에 미리 구워 넣었다 */
    scrollDraw(terrain.det,scGnd);

}
function render(){
  /* 이전 프레임에서 오류가 났더라도 상태를 깨끗이 되돌린다 */
  ctx.setTransform(RS,0,0,RS,0,0);
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  ctx.shadowColor='rgba(0,0,0,0)'; ctx.shadowBlur=0;
  ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
  ctx.setLineDash([]); ctx.lineCap='butt'; ctx.lineJoin='miter';
  ctx.save();
  if(shake>0){ const s=shake*.32; ctx.translate(rnd(-s,s),rnd(-s,s)); }
  drawSky();
  for(const p of props) drawProp(p);
  /* 구름 — 지형 위, 기체 아래. 한 층뿐이라 지형 구조물을 가리지 않는다 */
  if(cloudFar) scrollDraw(cloudFar,scFar);               /* 구름은 늘 그린다 — 값이 싸고 눈에 제일 띈다 */
  if(state==='title') drawTitleScene();
  if(state!=='title'){
    drawItems();
    /* 실루엣 그림자 — 기체를 그대로 한 번 더 비껴 그리고 multiply 로 겹친다.
       타원 하나로는 모양이 안 맞아 공중의 것들이 바닥에서 떠 보인다 */
    if(FX>=2){

      _shadowPass=0;
    }
    drawPlayerPlane();
    drawWrecks();
    drawBullets();

    drawEBullets();
  }
  drawParts(); drawRings();
  /* 기체 위를 덮는 구름 층은 두지 않는다 — 적탄이 안 보여 위험하고, 뿌옇다 */

  if(FX>=3) ctx.drawImage(crtCv,0,0,W,H);                /* 화면 무늬 — 제일 먼저 끈다 */
}

let last=performance.now(), lastTick=performance.now(), looping=false, loopGen=0;
let fpsAcc=0, fpsN=0, LOWFX=0, rErr=0, rMsg='';
/* 그래픽 단계 — 3=전부, 2=화면 무늬 끔, 1=+기체 그림자 끔 (구름은 늘 켬) */
let FX=3, fxHold=0, judgeT=0;
function loop(now,gen){
  if(gen!==loopGen) return;            /* 예전 세대의 루프는 여기서 끝난다 */
  lastTick=now;
  const rawDt=now-last;
  let dt=rawDt/16.6667; last=now; dt=clamp(dt,0,2.2);
  fpsAcc+=dt; fpsN++;
  /* 프레임 수가 아니라 흐른 시간으로 판정한다.
     아주 느린 기기는 40프레임을 모으는 데 몇 십 초가 걸려,
     정작 도움이 필요한 기기에서 조절이 영영 일어나지 않았다. */
  judgeT+=Math.min(rawDt,120);
  if(judgeT>=700){ const avg=fpsAcc/fpsN; judgeT=0; fpsAcc=0; fpsN=0;
    if(fxHold>0) fxHold--;
    /* 한 단계씩 내리고, 올릴 때는 한참 여유로울 때만 — 효과가 깜빡이지 않게 한다.
       비싼 것부터 끈다: 화면 무늬(약 20%) → 기체 그림자(약 57%). */
    if(avg>1.45){ if(FX>1){ FX--; fxHold=18; } }   /* 구름은 값이 거의 안 들어 끝까지 남긴다 */
    else if(avg<1.05 && FX<3 && fxHold<=0){ FX++; fxHold=45; }
    LOWFX = (FX<=1); }
  try{ update(dt); }catch(e){ console.error('update',e); }
  try{ render(); rErr=0; }
  catch(e){ console.error('render',e); rErr++; rMsg=(e&&e.message)||String(e);
    if(rErr>8){ try{
      ctx.setTransform(RS,0,0,RS,0,0); ctx.globalAlpha=1;
      ctx.fillStyle='#1a0d0d'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ff9a8a'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='bold 13px ui-monospace,monospace';
      ctx.fillText('그래픽 오류가 반복됩니다',W/2,H/2-14);
      ctx.font='bold 10px ui-monospace,monospace';
      ctx.fillText(String(rMsg).slice(0,44),W/2,H/2+6);
    }catch(_){} } }
  const g=loopGen;
  requestAnimationFrame(n=>loop(n,g)); // 무슨 일이 있어도 루프는 계속 돈다
}
function kick(){                        // 멈춰 있으면 다시 굴린다
  last=performance.now(); lastTick=last; fpsAcc=0; fpsN=0;
  loopGen++;                            // 세대를 올려 기존 루프를 무효화
  looping=true;
  const g=loopGen;
  requestAnimationFrame(n=>loop(n,g));
}
/* 감시견: 0.6초 넘게 화면이 안 그려지면 루프를 되살린다 */
setInterval(()=>{
  if(performance.now()-lastTick>900){ looping=false; kick(); }
},700);

/* ==================== 조작 ==================== */
let pid=null,px=0,py=0;
/* 더블탭 폭탄 — 두 번째 탭이 이 안에 들어와야 인정한다 */
const DBL_MS=320, DBL_PX=52,   /* 탭 사이 시간·거리 */
      TAP_MS=260, TAP_PX=20;   /* 한 번의 탭으로 칠 수 있는 길이·움직임 */
let tapDown=0,tapDX=0,tapDY=0,tapMove=0,tapEnd=0,tapEX=0,tapEY=0,tapUsed=false;
cv.addEventListener('pointerdown',e=>{
  audioOn();
  if(state==='card'){
    const r=cv.getBoundingClientRect();
    const kx=W/r.width, ky=H/r.height;          /* 가로·세로 배율을 따로 계산 */
    const mx=(e.clientX-r.left)*kx, my=(e.clientY-r.top)*ky;
    if(canReroll()){
      const r2=rerollBox();
      if(mx>=r2.x-14&&mx<=r2.x+r2.w+14&&my>=r2.y-10&&my<=r2.y+r2.h+14){ doReroll(); return; }
    }
    for(let i=0;i<cardPick.length;i++){
      const b=cardBox(i), pad=6;
      /* 카드 세로 전체를 덮는 넓은 기둥 판정 — 아래쪽 여백까지 눌린다 */
      if(mx>=b.x-pad&&mx<=b.x+b.w+pad&&my>=b.y-16&&my<=b.y+b.h+18){
        takeCard(cardPick[i]); break;
      }
    }
    return;
  }
  if(state!=='play') return;
  /* 화면을 두 번 톡톡 치면 폭탄.
     조종은 끌어서 하므로, '짧게 눌렀다 뗀' 탭이 연달아 두 번일 때만 친다 */
  const now=performance.now();
  tapUsed=false;
  if(now-tapEnd<DBL_MS && Math.hypot(e.clientX-tapEX,e.clientY-tapEY)<DBL_PX){
    tapEnd=0; tapUsed=true;        /* 이 탭은 짝으로 다 썼다 — 뗄 때 다시 무장하지 않는다 */
    useBomb();
  }
  tapDown=now; tapDX=e.clientX; tapDY=e.clientY; tapMove=0;
  pid=e.pointerId; px=e.clientX; py=e.clientY; cv.setPointerCapture(pid);
});
cv.addEventListener('pointermove',e=>{
  if(pid!==e.pointerId||state!=='play') return;
  const rect=cv.getBoundingClientRect(), k=W/rect.width;
  const dx=(e.clientX-px)*k*1.12, dy=(e.clientY-py)*k*1.12;
  player.x=clamp(player.x+dx,18,W-18); player.y=clamp(player.y+dy,44,H-28);
  player.roll=clamp(player.roll+dx*.05,-1,1);
  if(tutOn) tutMoved+=Math.abs(dx)+Math.abs(dy);
  tapMove+=Math.abs(e.clientX-px)+Math.abs(e.clientY-py);
  px=e.clientX; py=e.clientY;
});
const endPtr=e=>{
  if(pid!==e.pointerId) return;
  /* 짧고 거의 안 움직인 접촉만 '탭'으로 기억한다 — 조종 중에는 터지지 않는다 */
  const now=performance.now();
  if(!tapUsed && now-tapDown<TAP_MS && tapMove<TAP_PX){ tapEnd=now; tapEX=tapDX; tapEY=tapDY; }
  else tapEnd=0;
  tapUsed=false;
  pid=null;
};
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
addEventListener('keydown',e=>{ keys[e.key]=true; if(e.key===' '){e.preventDefault();useBomb();} });
addEventListener('keyup',e=>{ keys[e.key]=false; });

/* ==================== 화면 ==================== */
function show(id,on){ $(id).classList.toggle('on',on); }
function updBomb(){ $('bomb').querySelector('b').textContent=bombs; }
/* ===== 첫 조작 안내 =====
   조작법을 글로 적어두면 아무도 읽지 않는다. 직접 해보게 하고,
   해내면 다음으로 넘어간다. 안내 중에는 적이 쏘지 않아 안전하다. */
const TUTSTEP=[
  {msg:'화면을 끌어서 움직여 보세요', sub:'어디를 잡아도 됩니다',  need:'move'},
  {msg:'총은 저절로 나가요',          sub:'적에게 맞춰 보세요',    need:'kill'},
  {msg:'화면을 두 번 톡톡 치면 폭탄',  sub:'위험할 때 쓰세요',      need:'bomb'}
];
let tutReplay=0;
let tutOn=0, tutStep=0, tutT=0, tutMoved=0, tutKills=0, tutBombs=0, tutDone=0;
function tutSeen(){ try{ return localStorage.getItem('iw.tut')==='1'; }catch(_){ return false; } }
function tutMark(){ try{ localStorage.setItem('iw.tut','1'); }catch(_){} }
function tutStart(){
  tutOn=1; tutStep=0; tutT=0; tutMoved=0; tutKills=0; tutBombs=0; tutDone=0;
  bannerT=0;                       /* 스테이지 배너와 안내 글이 겹치지 않게 */
  $('bTutSkip').classList.add('on');
}
function tutEnd(){
  tutOn=0; tutMark();
  $('bTutSkip').classList.remove('on');
}
/* 한 단계를 해냈는지 본다 */
function tutCheck(){
  if(!tutOn) return;
  tutT++;
  if(tutDone){ if(tutT>96) tutEnd(); return; }
  const st=TUTSTEP[tutStep]; if(!st) { tutDone=1; tutT=0; return; }
  const ok = st.need==='move' ? tutMoved>110
           : st.need==='kill' ? tutKills>=3
           : tutBombs>=1;
  if(ok){
    tutStep++; tutT=0; sfx.pop&&sfx.pop();
    if(tutStep>=TUTSTEP.length){ tutDone=1; bombs=Math.max(bombs,D.bombs); updBomb(); }
  }
}
function drawTutorial(){
  if(!tutOn) return;
  const done=tutDone, st=TUTSTEP[tutStep];
  ctx.save();
  /* 글이 읽히도록 위쪽만 살짝 눌러준다 */
  const gg=ctx.createLinearGradient(0,H*.12,0,H*.40);
  gg.addColorStop(0,'rgba(6,10,16,0)'); gg.addColorStop(.42,'rgba(6,10,16,.62)');
  gg.addColorStop(1,'rgba(6,10,16,0)');
  ctx.fillStyle=gg; ctx.fillRect(0,H*.12,W,H*.28);

  const y=H*.25, pu=.5+.5*Math.sin(time*.10);
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  if(done){
    ctx.font='bold 25px ui-monospace,monospace';
    ctx.lineWidth=7; ctx.strokeStyle='rgba(6,10,16,.9)'; ctx.strokeText('준비 완료!',W/2,y);
    ctx.fillStyle='#ffd98a'; ctx.fillText('준비 완료!',W/2,y);
    ctx.font='bold 13px ui-monospace,monospace';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(6,10,16,.9)';
    ctx.strokeText('이제 진짜 전투입니다',W/2,y+30);
    ctx.fillStyle='#cfe0c6'; ctx.fillText('이제 진짜 전투입니다',W/2,y+30);
  } else {
    /* 몇 번째 단계인지 */
    ctx.font='bold 11px ui-monospace,monospace';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(6,10,16,.9)';
    const tag=(tutStep+1)+' / '+TUTSTEP.length;
    ctx.strokeText(tag,W/2,y-34); ctx.fillStyle='#8fb08a'; ctx.fillText(tag,W/2,y-34);
    ctx.font='bold 19px ui-monospace,monospace';
    ctx.lineWidth=7; ctx.strokeStyle='rgba(6,10,16,.92)'; ctx.strokeText(st.msg,W/2,y);
    ctx.fillStyle='#ffe9a8'; ctx.fillText(st.msg,W/2,y);
    ctx.font='bold 12px ui-monospace,monospace';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(6,10,16,.9)'; ctx.strokeText(st.sub,W/2,y+26);
    ctx.fillStyle='#b9c7ae'; ctx.fillText(st.sub,W/2,y+26);

    /* 눈으로 보는 신호 */
    if(st.need==='move'){
      const sw=Math.sin(time*.06)*40;
      ctx.globalAlpha=.30+.30*pu;
      ctx.strokeStyle='#ffe9a8'; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(player.x+sw,player.y+44,17,0,TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(player.x-46,player.y+44); ctx.lineTo(player.x+46,player.y+44);
      ctx.stroke();
      ctx.lineCap='butt';
    } else if(st.need==='bomb'){
      for(let i=0;i<2;i++){
        const t=(time*.05+i*.5)%1;
        ctx.globalAlpha=(1-t)*.55;
        ctx.strokeStyle='#ffd98a'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(W/2,H*.62,16+t*34,0,TAU); ctx.stroke();
      }
      ctx.globalAlpha=.85; ctx.fillStyle='#ffd98a';
      ctx.beginPath(); ctx.arc(W/2,H*.62,7,0,TAU); ctx.fill();
    }
  }
  ctx.restore();
}
function startGame(){
  goFull(); keepAwake();

  if(!tutSeen()||tutReplay){ tutReplay=0; tutStart(); } else tutOn=0;

function gameOver(){
  if(tutOn) tutEnd();
  state='over'; boom(player.x,player.y,44,'#ffcc4d',5,1.3); sfx.bigboom();
  const rec=[
    ['점수',      score,        SAVE.best],

    ['강화 단계', cardLv,       SAVE.bestCard]
  ];
  if(score>SAVE.best) SAVE.best=score;
  if(stageNo>SAVE.bestStage) SAVE.bestStage=stageNo;
  if(runChain>SAVE.bestChain) SAVE.bestChain=runChain;

  best=SAVE.best; writeSave();
  $('ovTable').innerHTML=rec.map(r=>{
    const isNew=r[2]&&r[1]>r[2];
    return '<tr><th>'+r[0]+'</th><td>'+r[1].toLocaleString()+
      (isNew?'<i> 신기록!</i>':(r[2]?'<s> 최고 '+r[2].toLocaleString()+'</s>':''))+'</td></tr>';
  }).join('');
  $('ovMedal').textContent='훈장 +'+runMedal.toLocaleString()+
    '   (보유 '+SAVE.medal.toLocaleString()+')';
  /* 랭킹 등록 */
  const now=new Date(), ent={s:score,st:stageNo,c:runChain,l:cardLv,
    d:(now.getMonth()+1)+'/'+now.getDate(), me:1};
  SAVE.rank.forEach(r=>{ delete r.me; });
  SAVE.rank.push(ent);
  SAVE.rank.sort((a,b)=>b.s-a.s);
  SAVE.rank=SAVE.rank.slice(0,10);
  writeSave();
  const myIdx=SAVE.rank.indexOf(ent);
  $('ovRankTitle').textContent = myIdx>=0
    ? ('내 기록  '+(myIdx+1)+'위' + (myIdx===0?'  🏆 최고 기록!':''))
    : '내 기록  순위권 밖';
  renderRank('ovRank');
  $('hudbtns').classList.remove('on'); $('bomb').classList.remove('on');
  later(48,()=>show('shOver',true));
}

function renderShop(){

    const lv=upLv(u.id), done=lv>=u.max, cost=done?0:u.cost[lv];

      '<span class="lv">'+lv+'/'+u.max+'</span>'+

      (done?'완료':cost+'')+'</button></div>';
