<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>IRON WINGS 2</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1418">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IRON WINGS 2">

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}
  html,body{margin:0;height:100%;background:#120f14;overflow:hidden;
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    font-family:"Apple SD Gothic Neo","Malgun Gothic",ui-monospace,monospace}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    touch-action:none;-ms-touch-action:none}
  #stage{position:relative;height:100%;aspect-ratio:360/640;max-width:100%;max-height:100%;
    touch-action:none;-ms-touch-action:none;
    box-shadow:0 0 0 2px #17222e,0 0 44px rgba(0,0,0,.7)}
  canvas{display:block;width:100%;height:100%;touch-action:none;
    image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated}
  #stage,.sheet,.btn,.mini,#bomb{touch-action:none}

  .btn{border:0;font:inherit;font-weight:700;color:#1a1206;
    -webkit-text-fill-color:#1a1206;forced-color-adjust:none;background:#d8c07a;
    border-radius:6px;padding:14px 26px;font-size:19px;letter-spacing:.03em;
    box-shadow:0 4px 0 #8f7a3f;cursor:pointer}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8f7a3f}
  .btn.ghost{background:#33413a;color:#cfd8c8;box-shadow:0 4px 0 #1c261f;font-size:16px;padding:11px 20px}
  .btn.ghost:active{box-shadow:0 1px 0 #1c261f}
  #ovTable{border-collapse:collapse;font-size:14px;color:#cfe0c6}
  #ovTable th{text-align:left;padding:3px 14px 3px 0;font-weight:400;color:#93a68f}
  #ovTable td{text-align:right;padding:3px 0;font-weight:700;color:#f0e2ab}
  #ovTable i{font-style:normal;color:#ff9ab0;font-size:11px}
  #ovTable s{text-decoration:none;color:#5f7062;font-size:11px}
  .sheet h1 small{display:block;font-size:12px;letter-spacing:.1em;color:#8fd9a0;margin-top:5px}
  #shopList{display:flex;flex-direction:column;gap:7px;width:100%;max-width:300px}
  .srow{display:flex;align-items:center;gap:8px;background:rgba(12,20,16,.7);
    border:1px solid #3d4d42;border-radius:7px;padding:8px 10px}
  .srow .nm{flex:1;text-align:left;font-size:13px;color:#e6ecdf}
  .srow .lv{font-size:11px;color:#8fd9a0;min-width:34px}
  .srow button{border:0;border-radius:5px;padding:6px 11px;font:inherit;font-size:12px;
    font-weight:700;background:#c9a94e;color:#1a1206;cursor:pointer;touch-action:none}
  .srow button:disabled{background:#3a463c;color:#6d7a6f}
  .ranktitle{margin:0;font-size:13px;color:#e8edf2;letter-spacing:.02em}
  table.rank{border-collapse:collapse;font-size:12px;color:#c8d3bd;max-width:300px;width:100%}
  table.rank th{width:24px;text-align:right;padding:2px 6px 2px 0;color:#9a8a92;font-weight:700}
  table.rank td{padding:2px 4px}
  table.rank td.sc{text-align:right;color:#e8edf2;font-weight:700;width:76px}
  table.rank td.dt{color:#9fb4c6;font-size:11px}
  table.rank td.dy{color:#6f7b84;font-size:10px;text-align:right}
  table.rank td.empty{text-align:center;color:#6f7b84;padding:10px}
  table.rank tr.me{background:rgba(180,54,46,.22)}
  table.rank tr.me th,table.rank tr.me td.sc{color:#ffb4a8}
  .btn.ghost.tiny{font-size:12px;padding:7px 14px;opacity:.72;letter-spacing:0}
  #planeSel{display:flex;gap:7px;margin-bottom:2px}
  .dbtn{border:2px solid #4a5a4e;background:rgba(18,26,22,.72);color:#93a68f;
    border-radius:8px;padding:8px 9px;font:inherit;line-height:1.3;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;touch-action:none;min-width:96px}
  .dbtn b{font-size:14px;font-weight:700}
  .dbtn span{font-size:9px;opacity:.8}
  .dbtn.on{border-color:#e8d99a;background:rgba(232,217,154,.16);color:#f0e2ab;
    box-shadow:0 0 16px rgba(232,217,154,.25)}

  .sheet{position:absolute;inset:0;touch-action:none;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:15px;padding:26px;text-align:center;
    background:rgba(10,16,22,.84);color:#e6ecdf}
  .sheet.on{display:flex}
  #shTitle{background:linear-gradient(to bottom,rgba(6,10,16,0) 52%,rgba(6,10,16,.55) 70%,
           rgba(6,10,16,.88) 100%);justify-content:flex-end;padding-bottom:34px;gap:10px}
  .btn.big{font-size:24px;padding:15px 46px;letter-spacing:.25em;
    color:#241802;-webkit-text-fill-color:#241802;
    text-shadow:0 1px 0 rgba(255,255,255,.55);
    background:linear-gradient(#ffd98a,#e8913c);
    color:#2a1606;-webkit-text-fill-color:#2a1606;
    border:2px solid #8a2e1e;
    box-shadow:0 5px 0 #8a4a16,0 0 30px rgba(255,160,70,.42)}

  .sheet h1{margin:0;font-size:34px;letter-spacing:.08em;color:#e8d99a;
    text-shadow:0 3px 0 #4a3d17,0 0 20px rgba(220,190,110,.3)}
  .sheet h1 small{display:block;font-size:13px;letter-spacing:.4em;color:#8fa08a;margin-top:6px}
  .sheet p{margin:0;font-size:14px;line-height:1.75;color:#a8b8a6;max-width:20em}
  .big{font-size:25px;color:#e8d99a;margin:0}
  .keys{font-size:13px;color:#b9c7ae;line-height:1.7;text-shadow:0 1px 2px rgba(0,0,0,.7)}

  #hudbtns{position:absolute;top:7px;right:7px;display:none;gap:6px}
  #hudbtns.on{display:flex}
  .mini{width:34px;height:34px;border:0;border-radius:6px;background:rgba(10,20,16,.5);
    color:#c3d3bd;font-size:15px;line-height:1;cursor:pointer}
  .mini:active{background:rgba(10,20,16,.85)}

  #bomb{position:absolute;right:13px;bottom:16px;touch-action:none;width:80px;height:80px;border-radius:50%;
    border:3px solid rgba(232,217,154,.7);background:rgba(24,34,28,.4);color:#e8d99a;
    font-size:12px;font-weight:700;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:1px;cursor:pointer}
  #bomb.on{display:flex}
  #bomb:active{background:rgba(232,217,154,.28)}
  #bomb b{font-size:25px;line-height:1}
  /* 조작 안내 — 건너뛰기는 항상 손 닿는 자리에 */
  #bTutSkip{position:absolute;left:50%;transform:translateX(-50%);top:46px;
    display:none;z-index:6;opacity:.8;font-size:11px;padding:6px 14px}
  #bTutSkip.on{display:block}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="game"></canvas>

  <div id="hudbtns">
    <button class="mini" id="mVib">〰</button>
    <button class="mini" id="mSound">♪</button>
    <button class="mini" id="mPause">❚❚</button>
  </div>
  <button id="bomb"><b>3</b>폭탄</button>
  <button class="btn ghost tiny" id="bTutSkip">건너뛰기</button>

  <div class="sheet on" id="shTitle">
    <button class="btn big" id="bStart">출 격</button>
    <button class="btn ghost" id="bShop">해금 상점</button>
    <div style="display:flex;gap:8px">
      <button class="btn ghost tiny" id="bRank">기록</button>
      <button class="btn ghost tiny" id="bTut">조작 안내</button>
      <button class="btn ghost tiny" id="bLang">EN</button>
      <button class="btn ghost tiny" id="bUpd">업데이트 확인</button>
    </div>
    <p class="keys">화면을 끌어 조종 · 사격은 자동<br>
       두 번 톡톡 치면 <b>폭탄</b></p>
  </div>

  <div class="sheet" id="shRank">
    <h1>최고 기록<small>TOP 10</small></h1>
    <table id="rkList" class="rank"></table>
    <button class="btn ghost" id="bRankBack">닫기</button>
  </div>

  <div class="sheet" id="shShop">
    <h1>해금 상점<small id="shMedal">훈장 0</small></h1>
    <div id="shopList"></div>
    <button class="btn" id="bShopClose">닫기</button>
  </div>

  <div class="sheet" id="shPause">
    <h1>잠깐 멈춤</h1>
    <button class="btn" id="bResume">계속하기</button>
    <button class="btn ghost" id="bQuit">처음부터</button>
  </div>

  <div class="sheet" id="shOver">
    <h1>격추 기록</h1>
    <table id="ovTable"></table>
    <p id="ovMedal" class="big">훈장 +0</p>
    <p id="ovRankTitle" class="ranktitle">내 기록</p>
    <table id="ovRank" class="rank"></table>
    <div style="display:flex;gap:10px">
      <button class="btn" id="bRetry">다시 출격</button>
      <button class="btn ghost" id="bShop2">해금 상점</button>
    </div>
    <button class="btn ghost tiny" id="bShare">기록 공유</button>
  </div>
</div></div>

let ctx=cv.getContext('2d');   /* 미리 그려 두는 그림을 만들 때 잠시 바꿔 쓴다 */
const W=360,H=640;
/* ===== 그리기 해상도 =====
   논리 좌표는 360x640 그대로다. 실제로 칠하는 픽셀만 RS 배로 늘린다.
   폰 화면은 가로 1440px 인데 360px 로 그려 4배로 늘리면 뭉툭해 보인다.
   RS=2 면 720px 로 그려 2배만 늘리므로 선이 두 배로 촘촘해진다.
   (3 배처럼 딱 안 나누어떨어지는 값은 픽셀 크기가 들쭉날쭉해져 쓰지 않는다) */
const RS=(()=>{
  try{
    const q=localStorage.getItem('iw.rs');          /* 수동 지정이 있으면 따른다 */
    if(q) return Math.max(1,Math.min(4,+q|0));
  }catch(_){}
  const dpr=window.devicePixelRatio||1;
  if(dpr<1.5) return 1;                             /* 저밀도 화면은 올릴 이유가 없다 */
  const mem=navigator.deviceMemory;                 /* 알 수 있으면 참고만 */
  if(mem&&mem<3) return 1;
  return 2;
})();
cv.width=W*RS; cv.height=H*RS;
const SCREEN_H=H;              /* 화면 높이 — 지형 타일은 이보다 길다 */
const TERR_TILES=3;            /* 지형 타일 = 화면 3장. 같은 그림이 되풀이되는 간격을 늘린다 */
/* 도트 보존 — 캔버스 안에서도, 화면으로 확대될 때도 보간하지 않는다 */
ctx.imageSmoothingEnabled=false;
const PI=Math.PI, TAU=PI*2;
const VER='R98';

let LANG=(()=>{
  try{ const q=localStorage.getItem('iw.lang'); if(q==='ko'||q==='en') return q; }catch(_){}
  return /^ko/i.test(navigator.language||'') ? 'ko' : 'en';
})();
const TCACHE=new Map();
function T(s){
  if(LANG==='ko'||s==null) return s;
  s=String(s);
  if(!/[가-힣]/.test(s)) return s;
  let r=TCACHE.get(s);
  if(r!==undefined) return r;
  r=EN[s];
  if(r===undefined){ for(const p of ENP){ const m=s.match(p[0]); if(m){ r=p[1](m); break; } } }
  if(r===undefined){ r=s; if(window.__KOMISS) window.__KOMISS.add(s); }
  TCACHE.set(s,r); return r;
}
/* 캔버스 — 그리는 글자와 재는 너비를 함께 바꿔야 가운데 정렬이 맞는다 */
{ const _f=ctx.fillText.bind(ctx), _s=ctx.strokeText.bind(ctx), _m=ctx.measureText.bind(ctx);
  ctx.fillText  =function(t,x,y,w){ return w===undefined?_f(T(t),x,y):_f(T(t),x,y,w); };
  ctx.strokeText=function(t,x,y,w){ return w===undefined?_s(T(t),x,y):_s(T(t),x,y,w); };
  ctx.measureText=function(t){ return _m(T(t)); };
}
/* 화면의 HTML 글자 — 상점·기록처럼 나중에 만들어지는 것도 따라간다 */
function trDOM(root){
  if(LANG==='ko') return;
  let n; const hit=[];
  const w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT,{
    acceptNode(x){
      const t=x.parentNode&&x.parentNode.nodeName;          /* 코드와 스타일은 건너뛴다 */
      if(t==='SCRIPT'||t==='STYLE'||t==='NOSCRIPT') return NodeFilter.FILTER_REJECT;
      return /[가-힣]/.test(x.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
    }});
  while(n=w.nextNode()) hit.push(n);
  for(const node of hit){
    const s=node.nodeValue.trim(); if(!s) continue;
    const r=T(s); if(r!==s) node.nodeValue=node.nodeValue.replace(s,r);
  }
}
function setLang(v){ try{ localStorage.setItem('iw.lang',v); }catch(_){} location.reload(); }
/* 좁은 자리에 글자를 맞춘다 — 영어는 한글보다 길어 그대로 두면 칸을 넘는다 */
function fitText(t,x,y,mw,gap){
  t=T(t);
  if(ctx.measureText(t).width<=mw){ ctx.fillText(t,x,y); return; }
  const ws=String(t).split(' '); let a='',b='';
  for(const w of ws){
    const c=a?a+' '+w:w;
    if(!b && ctx.measureText(c).width<=mw) a=c; else b=b?b+' '+w:w;
  }
  if(!a||!b){ ctx.fillText(t,x,y,mw); return; }
  const g=gap||5;
  ctx.fillText(a,x,y-g,mw); ctx.fillText(b,x,y+g,mw);
}

if(LANG!=='ko'){
  try{ document.documentElement.lang='en'; }catch(_){}
  trDOM();
  try{
    new MutationObserver(ms=>{
      for(const m of ms){
        if(m.type==='characterData'){
          const v=m.target.nodeValue, s=v&&v.trim();
          if(s&&/[가-힣]/.test(s)){ const r=T(s); if(r!==s) m.target.nodeValue=v.replace(s,r); }
        } else {
          for(const nd of m.addedNodes) trDOM(nd.nodeType===1?nd:(nd.parentNode||document.body));
        }
      }
    }).observe(document.body,{childList:true,subtree:true,characterData:true});
  }catch(_){}
}

let actx=null, muted=false;
function audioOn(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume(); }catch(e){} }
function tone(f,dur,type,vol,slide){
  if(!actx||muted) return;
  const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,vol,lp){
  if(!actx||muted) return;
  const n=(actx.sampleRate*dur)|0, buf=actx.createBuffer(1,n,actx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=actx.createBufferSource(); s.buffer=buf;
  const g=actx.createGain(); g.gain.value=vol||.15;
  if(lp){ const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp;
    s.connect(f); f.connect(g); } else s.connect(g);
  g.connect(actx.destination); s.start();
}

/* ==================== 배경 ==================== */
function blob(g,x,y,r,a){
  const gr=g.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,'rgba(255,255,255,'+a+')');
  gr.addColorStop(.5,'rgba(238,244,250,'+(a*.55)+')');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
}
/* 뭉게구름 한 덩이.
   반투명하고 크게 깔면 화면이 안개가 된다. 그래서 작고, 거의 불투명하고,
   테두리가 있는 '덩어리'로 그린다 — 안개가 아니라 지나가는 물체로 읽히게.
   테두리는 먼저 긋고 그 위를 채운다. 그래야 덩이 안쪽의 원 윤곽이 덮여
   바깥 실루엣만 남는다 */
function puff(g,x,y,r,col,lit,shd,line,a){
  const n=3+rint(3), cs=[];
  for(let i=0;i<n;i++)
    cs.push([Math.round(x+rnd(-r*.85,r*.85)),
             Math.round(y+rnd(-r*.22,r*.22)),
             Math.round(r*rnd(.60,1.0))]);
  const path=(ox,oy,k)=>{ g.beginPath();
    for(const c of cs){ const rr=Math.round(c[2]*(k||1));
      g.moveTo(c[0]+ox+rr,c[1]+oy); g.arc(c[0]+ox,c[1]+oy,rr,0,TAU); } };
  g.save(); g.globalAlpha=a;
  g.fillStyle=shd;  path(0,Math.round(r*.26)); g.fill();      /* 그늘진 아랫면 */
  g.strokeStyle=line; g.lineWidth=3; g.lineJoin='round';
  path(0,0); g.stroke();                                      /* 실루엣 테두리 */
  g.fillStyle=col;  path(0,0); g.fill();                      /* 본체 */
  g.fillStyle=lit;  path(Math.round(-r*.18),Math.round(-r*.26),.56); g.fill();
  g.restore();
}
/* 한 층 분량의 구름. tint 는 [본체, 밝은면, 그늘, 테두리] */
function cloudLayer(count,rad,alpha,tint){
  const t=tint||['#e8eef6','#ffffff','#b9c6d6','#7d8ea2'];
  const c=document.createElement('canvas'); c.width=W*RS; c.height=H*RS;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false; g.scale(RS,RS);
  for(let i=0;i<count;i++){
    const x=rnd(-30,W+30), y=rnd(0,H), r=rad*rnd(.7,1.15);
    for(const dy of [-H,0,H]) puff(g,x,y+dy,r,t[0],t[1],t[2],t[3]||'#7d8ea2',alpha);
  }
  return c;
}

const TQ=2;                     /* 지형 도트 격자 — 한 블록 = 2px */
/* 캔버스를 1/q 로 줄였다가 다시 늘려 도트를 뭉친다.
   보간을 끈 상태로 줄이므로 평균이 아니라 한 점을 골라 온다 —
   평균을 내면 색이 섞여 바래기 때문이다 */
function quantize(cvs,q){
  if(!q||q<2) return cvs;
  const sw=Math.round(cvs.width/q), sh=Math.round(cvs.height/q);
  const t=document.createElement('canvas'); t.width=sw; t.height=sh;
  const tc=t.getContext('2d');
  tc.imageSmoothingEnabled=false;
  tc.drawImage(cvs,0,0,cvs.width,cvs.height,0,0,sw,sh);
  const c=cvs.getContext('2d');
  c.setTransform(1,0,0,1,0,0);
  c.globalAlpha=1; c.globalCompositeOperation='copy';
  c.imageSmoothingEnabled=false;
  c.drawImage(t,0,0,sw,sh,0,0,cvs.width,cvs.height);
  c.globalCompositeOperation='source-over';
  return cvs;
}
function tblob(c,x,y,rx,ry,rot,col,shadow){
  if(shadow){ c.fillStyle=shadow; c.beginPath(); c.ellipse(x+rx*.16,y+ry*.22,rx,ry,rot,0,TAU); c.fill(); }
  c.fillStyle=col; c.beginPath(); c.ellipse(x,y,rx,ry,rot,0,TAU); c.fill();
}
function ttree(c,x,y,r,mid,lit,shadowA){
  c.fillStyle='rgba(0,0,0,'+(shadowA||.34)+')';
  c.beginPath(); c.arc(x+r*.42,y+r*.5,r,0,TAU); c.fill();
  /* 테두리를 먼저 긋고 그 위를 채운다 — 없으면 나무들이 녹색 덩어리로 뭉친다 */
  tao(c,x+r*.3,y+r*.42,r*2.0,r*1.4,.24);
  c.fillStyle=TOUT;
  c.beginPath(); c.arc(x,y,r+Math.max(.8,r*.085),0,TAU); c.fill();
  c.fillStyle=mid; c.beginPath(); c.arc(x,y,r,0,TAU); c.fill();
  c.fillStyle=lit;                       /* 납작하게 — 동그란 하이라이트는 구슬처럼 보인다 */
  c.beginPath(); c.ellipse(x-r*.22,y-r*.26,r*.62,r*.48,-.5,0,TAU); c.fill();
}
/* 거목의 수관 — 큰 원 하나는 '공'처럼 보인다. 작은 덩이 여럿을 겹쳐 쌓는다 */
function tcrown(c,x,y,r,mid,lit){
  tao(c,x+r*.42,y+r*.54,r*2.3,r*1.6,.32);
  const n=3+rint(3), ps=[[x,y,r*.74]];
  for(let i=0;i<n;i++){ const a=i/n*TAU+rnd(-.3,.3), q=rnd(.24,.52);
    ps.push([x+Math.cos(a)*r*q, y+Math.sin(a)*r*q, r*rnd(.50,.74)]); }
  c.fillStyle=TOUT;
  for(const p of ps){ c.beginPath(); c.arc(p[0],p[1],p[2]+Math.max(1,r*.08),0,TAU); c.fill(); }
  c.fillStyle=mid;
  for(const p of ps){ c.beginPath(); c.arc(p[0],p[1],p[2],0,TAU); c.fill(); }
  c.fillStyle=lit;
  for(const p of ps){ c.beginPath(); c.arc(p[0]-p[2]*.26,p[1]-p[2]*.30,p[2]*.56,0,TAU); c.fill(); }
}
/* 야자 — 둥근 수관만 반복하면 숲이 모자이크가 된다. 갈라진 잎으로 모양을 섞는다 */
function tpalm(c,x,y,r,mid,lit){
  tao(c,x+r*.32,y+r*.42,r*1.9,r*1.35,.26);
  const n=5+rint(2), a0=rnd(0,TAU);
  const frond=(len,wid,off,col)=>{ c.fillStyle=col;
    for(let i=0;i<n;i++){ const a=a0+i/n*TAU;
      c.save(); c.translate(x,y); c.rotate(a);
      c.beginPath(); c.ellipse(r*.58,off,r*len,r*wid,0,0,TAU); c.fill(); c.restore(); } };
  frond(.78,.28,0,TOUT);          /* 외곽 */
  frond(.68,.21,0,mid);           /* 잎 */
  c.fillStyle=lit;                /* 빛 받는 쪽 잎만 밝게 */
  for(let i=0;i<n;i++){ const a=a0+i/n*TAU;
    if(Math.cos(a)>.15||Math.sin(a)>.5) continue;
    c.save(); c.translate(x,y); c.rotate(a);
    c.beginPath(); c.ellipse(r*.54,-r*.05,r*.56,r*.12,0,0,TAU); c.fill(); c.restore(); }
  c.fillStyle=TOUT; c.beginPath(); c.arc(x,y,Math.max(1.5,r*.22),0,TAU); c.fill();
  c.fillStyle=mid;  c.beginPath(); c.arc(x-r*.05,y-r*.05,Math.max(1,r*.13),0,TAU); c.fill();
}
function tconifer(c,x,y,r){
  const R=Math.round, tri=(ax,ay,bx,by,cx2,cy2)=>{ c.beginPath();
    c.moveTo(R(ax),R(ay)); c.lineTo(R(bx),R(by)); c.lineTo(R(cx2),R(cy2)); c.closePath(); c.fill(); };
  c.fillStyle='rgba(30,50,70,.35)';
  tri(x+r*.6,y+r*1.5, x+r*2.1,y+r*1.9, x+r*.6,y+r*.4);     /* 드리운 그림자 */
  c.fillStyle=TOUT;                                         /* 외곽 — 한 치수 크게 */
  tri(x,y-r*1.95, x+r*1.22,y+r*1.62, x-r*1.22,y+r*1.62);
  c.fillStyle='#24402c';
  tri(x,y-r*1.7, x+r,y+r*1.4, x-r,y+r*1.4);
  c.fillStyle='#3d6e50';
  tri(x-r*.15,y-r*1.5, x+r*.35,y+r*1.1, x-r*.75,y+r*1.1);
  c.fillStyle='#eef6fb'; c.fillRect(R(x-r),R(y+r*1.3),R(r*2),Math.max(1,R(r*.5)));
}
/* 건물 — 기체의 plate() 와 같은 규칙.
   외곽을 한 치수 크게 '칠해서' 두르고, 그 위에 본체·윗면·그늘을 얹는다.
   stroke() 로 두르면 선이 경로에 걸쳐 반투명으로 번져 흐려 보인다 */
/* 색을 밝게(amt>0) 또는 어둡게(amt<0) — 지붕 한 색에서 음영 단계를 뽑아 쓴다 */
function tmix(hex,amt){
  const p=hexRGB(hex);
  const f=t=>Math.max(0,Math.min(255,Math.round(amt>0?t+(255-t)*amt:t*(1+amt))));
  return 'rgb('+f(p[0])+','+f(p[1])+','+f(p[2])+')';
}
/* 지붕 위 부속 — 환기구·물탱크·계단실. 이게 있어야 '도형'이 '건물'로 읽힌다 */
function troofbox(c,x,y,w,h,col){
  const R=Math.round; x=R(x); y=R(y); w=R(Math.max(2,w)); h=R(Math.max(2,h));
  c.fillStyle='rgba(0,0,0,.38)'; c.fillRect(x+1,y+2,w,h);
  c.fillStyle=TOUT;             c.fillRect(x-1,y-1,w+2,h+2);
  c.fillStyle=col;              c.fillRect(x,y,w,h);
  c.fillStyle=tmix(col,.28);    c.fillRect(x,y,w,Math.max(1,R(h*.34)));
}
/* 건물 — 위에서 내려다본 지붕.
   단색 사각형은 '도형'으로 보인다. 지붕을 세 종류로 나누고
   용마루·골·난간·이음매·부속을 얹어야 건물로 읽힌다 */
function tbuilding(c,x,y,w,h,roof,side,lit,winCol){
  const R=Math.round;
  x=R(x); y=R(y); w=R(Math.max(7,w)); h=R(Math.max(7,h));
  const rl=tmix(roof,.40), rd=tmix(roof,-.30), rdd=tmix(roof,-.58);
  const wide=w>=h, ratio=Math.max(w,h)/Math.min(w,h);
  const kind = ratio>1.75 ? 2 : (Math.random()<.46 ? 1 : 0);   /* 0 평지붕 1 박공 2 창고 */

  tao(c,x+w*.56,y+h*.64,Math.max(w,h)*1.15,Math.max(w,h)*.82,.26);
  c.fillStyle='rgba(0,0,0,.42)'; c.fillRect(x+R(w*.20),y+R(h*.22),w,h);

  /* 벽 — 그늘진 쪽(오른쪽 아래)으로 살짝 내밀어 높이를 보여준다 */
  const hw=Math.max(2,R(Math.min(w,h)*.17));
  c.fillStyle=TOUT; c.fillRect(x-1,y-1,w+hw+2,h+hw+2);
  c.fillStyle=side; c.fillRect(x,y,w+hw,h+hw);
  c.fillStyle=tmix(side,-.30);                       /* 벽 아래쪽을 더 어둡게 */
  c.fillRect(x+hw,y+h,w,hw); c.fillRect(x+w,y+hw,hw,h-hw);

  /* 지붕 */
  c.fillStyle=TOUT; c.fillRect(x-1,y-1,w+2,h+2);
  c.fillStyle=roof; c.fillRect(x,y,w,h);

  if(kind===1){                                      /* 박공 — 용마루에서 갈라진다 */
    if(wide){
      c.fillStyle=rd;  c.fillRect(x,y,w,h);                       /* 그늘진 처마쪽 */
      c.fillStyle=rl;  c.fillRect(x,y,w,R(h*.48));                /* 빛 받는 쪽 */
      c.fillStyle=rdd; c.fillRect(x,y+R(h*.48),w,1);              /* 처마 그늘 */
      c.fillStyle=tmix(roof,.62); c.fillRect(x,y+R(h*.48)-2,w,2); /* 용마루 */
      c.fillStyle=rd;                                             /* 서까래 — 그늘진 쪽만 */
      for(let k=x+4;k<x+w-3;k+=6) c.fillRect(k,y+R(h*.48)+1,1,h-R(h*.48)-2);
    } else {
      c.fillStyle=rd;  c.fillRect(x,y,w,h);
      c.fillStyle=rl;  c.fillRect(x,y,R(w*.48),h);
      c.fillStyle=rdd; c.fillRect(x+R(w*.48),y,1,h);
      c.fillStyle=tmix(roof,.62); c.fillRect(x+R(w*.48)-2,y,2,h);
      c.fillStyle=rd;
      for(let k=y+4;k<y+h-3;k+=6) c.fillRect(x+R(w*.48)+1,k,w-R(w*.48)-2,1);
    }
    if(Math.min(w,h)>10)                             /* 굴뚝 */
      troofbox(c,x+w*(wide?.74:.62),y+h*(wide?.12:.74),Math.max(2,w*.12),Math.max(2,h*.12),tmix(side,.1));
  } else if(kind===2){                               /* 창고 — 골이 진 지붕 */
    c.fillStyle=rl; c.fillRect(x,y,w,h);
    c.fillStyle=rd;
    if(wide) for(let k=y+2;k<y+h-1;k+=3) c.fillRect(x,k,w,1);
    else     for(let k=x+2;k<x+w-1;k+=3) c.fillRect(k,y,1,h);
    c.fillStyle=rdd;                                 /* 큰 문 */
    if(wide) c.fillRect(x+w-R(w*.17),y+2,R(w*.13),h-4);
    else     c.fillRect(x+2,y+h-R(h*.17),w-4,R(h*.13));
  } else {                                           /* 평지붕 — 난간과 부속 */
    c.fillStyle=rdd; c.fillRect(x,y,w,h);            /* 난간 */
    c.fillStyle=roof; c.fillRect(x+2,y+2,w-4,h-4);
    c.fillStyle=rd;                                  /* 이음매 */
    const st=Math.max(5,R(Math.max(w,h)/3));
    if(wide) for(let k=x+2+st;k<x+w-3;k+=st) c.fillRect(k,y+2,1,h-4);
    else     for(let k=y+2+st;k<y+h-3;k+=st) c.fillRect(x+2,k,w-4,1);
    c.fillStyle=tmix(roof,-.14);                     /* 풍화 얼룩 */
    for(let k=0;k<3;k++){
      const pw=R(rnd(2,Math.max(3,w*.3))), ph=R(rnd(2,Math.max(3,h*.3)));
      c.fillRect(x+2+R(rnd(0,Math.max(1,w-4-pw))),y+2+R(rnd(0,Math.max(1,h-4-ph))),pw,ph);
    }
    if(Math.min(w,h)>11){
      const sw=Math.max(3,R(w*.26)), sh=Math.max(3,R(h*.22));
      troofbox(c,x+w*.18,y+h*.20,sw,sh,tmix(side,.22));
      c.fillStyle=TOUT;                                /* 계단실 문 */
      c.fillRect(R(x+w*.18)+1,R(y+h*.20)+sh-1,Math.max(1,R(sw*.4)),2);
      if(Math.min(w,h)>15) troofbox(c,x+w*.60,y+h*.56,w*.24,h*.20,tmix(roof,-.40));
    }
  }
  /* 빛 받는 모서리 — 왼쪽 위에 가는 반사 */
  c.fillStyle='rgba(255,255,255,.20)';
  c.fillRect(x,y,w,1); c.fillRect(x,y,1,h);

  if(winCol){                                        /* 야간 — 창문 불빛 */
    c.fillStyle=winCol;
    for(let ry=3;ry<h-3;ry+=5) for(let rx=3;rx<w-3;rx+=5)
      if(Math.random()<(lit||.4)) c.fillRect(x+rx,y+ry,2,2);
    for(let k=0;k<hw;k+=3) if(Math.random()<.5) c.fillRect(x+w+k,y+hw+R(h*.4),1,2);
  }
}
/* 지형 외곽선 색 — 기체의 MATS.*.o 와 같은 역할.
   선을 긋는 대신 한 치수 큰 도형을 깔아 두르므로 반투명 번짐이 없다.
   새까만 한 가지 색을 모든 테마에 쓰면 그림이 딱딱해 보여서,
   테마마다 그 색조의 아주 어두운 색을 쓴다 (makeTerrain 이 갈아 끼운다) */
let TOUT='#15120c';

/* ===== 지면 굴곡 조명 =====
   땅이 한 가지 색의 평면이면 위에 아무리 물건을 올려도 납작해 보인다.
   눈에 안 보이는 높낮이를 만들고 한 방향에서 빛을 비춰, 비탈마다 밝기를 바꾼다.
   빛 받는 쪽은 따뜻하게, 그늘은 차갑게 — 명도만 바꾸면 색이 단조로워진다. */

/* 위아래가 이어지는 값 잡음. 격자 난수를 부드럽게 보간한다 */
function vnoise(w,h,gx,gy){
  const g=new Float32Array(gx*gy);
  for(let i=0;i<g.length;i++) g[i]=Math.random();
  const out=new Float32Array(w*h), sm=t=>t*t*(3-2*t);
  for(let y=0;y<h;y++){
    const fy=y/h*gy, yi=Math.floor(fy), ty=sm(fy-yi);
    const r0=(((yi%gy)+gy)%gy)*gx, r1=((((yi+1)%gy)+gy)%gy)*gx;
    for(let x=0;x<w;x++){
      const fx=x/w*gx, xi=Math.floor(fx), tx=sm(fx-xi);
      const c0=((xi%gx)+gx)%gx, c1=((xi+1)%gx)%gx;
      const a=g[r0+c0]+(g[r0+c1]-g[r0+c0])*tx;
      const b=g[r1+c0]+(g[r1+c1]-g[r1+c0])*tx;
      out[y*w+x]=a+(b-a)*ty;
    }
  }
  return out;
}
/* 큰 굴곡 위에 잔 굴곡을 얹어 자연스러운 높낮이를 만든다 */
function heightField(w,h,gx,gy){
  const a=vnoise(w,h,gx,gy), b=vnoise(w,h,gx*2,gy*2), c=vnoise(w,h,gx*4,gy*4);
  const out=new Float32Array(w*h);
  for(let i=0;i<out.length;i++) out[i]=a[i]*.60+b[i]*.28+c[i]*.12;
  return out;
}
/* 굴곡에 빛을 비춰 그늘층과 빛층 두 장을 만든다.
   낮은 해상도로 만들어 부드럽게 늘린다 — 어차피 완만한 음영이라 손해가 없다 */
function shadeLayers(W,H,opt){
  const S=4, w=Math.max(8,Math.round(W/S)), h=Math.max(8,Math.round(H/S));
  const hf=heightField(w,h,opt.gx||6,opt.gy||Math.max(4,Math.round((opt.gx||6)*H/W)));
  const mk=()=>{ const c=document.createElement('canvas'); c.width=w; c.height=h;
                 return [c,c.getContext('2d').createImageData(w,h)]; };
  const [sc,sd]=mk(), [lc,ld]=mk();
  const SH=hexRGB(opt.cool), LT=hexRGB(opt.warm);
  const amp=opt.amp==null?34:opt.amp;        /* 비탈을 얼마나 가파르게 볼 것인가 */
  const sA=opt.shadow==null?.42:opt.shadow;
  const lA=opt.light==null?.30:opt.light;
  const at=(x,y)=>hf[(((y%h)+h)%h)*w+(((x%w)+w)%w)];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    /* 비탈 기울기 — 빛은 왼쪽 위에서 온다 */
    const dx=(at(x+1,y)-at(x-1,y))*amp, dy=(at(x,y+1)-at(x,y-1))*amp;
    const nz=1/Math.sqrt(dx*dx+dy*dy+1);
    const lam=(-dx*-0.56 + -dy*-0.72 + 0.41)*nz;   /* 빛 방향과의 각도 */
    const k=(y*w+x)*4, v=Math.max(-1,Math.min(1,(lam-0.41)*2.2));
    if(v<0){ sd.data[k]=SH[0]; sd.data[k+1]=SH[1]; sd.data[k+2]=SH[2];
             sd.data[k+3]=Math.round(-v*sA*255); }
    else   { ld.data[k]=LT[0]; ld.data[k+1]=LT[1]; ld.data[k+2]=LT[2];
             ld.data[k+3]=Math.round(v*lA*255); }
  }
  sc.getContext('2d').putImageData(sd,0,0);
  lc.getContext('2d').putImageData(ld,0,0);
  return [sc,lc];
}
/* 색 띠에서 t(0~1) 위치의 색을 뽑는다 */
function rampAt(ramp,t){
  t=Math.max(0,Math.min(1,t));
  for(let i=1;i<ramp.length;i++){
    if(t<=ramp[i][0]){
      const a=ramp[i-1], b=ramp[i], k=(t-a[0])/Math.max(1e-6,b[0]-a[0]);
      const A=hexRGB(a[1]), B=hexRGB(b[1]);
      return [A[0]+(B[0]-A[0])*k, A[1]+(B[1]-A[1])*k, A[2]+(B[2]-A[2])*k];
    }
  }
  return hexRGB(ramp[ramp.length-1][1]);
}
/* 깊이(또는 높이) 분포를 색 띠로 칠한 바탕.
   바다를 한 가지 파랑으로 채우면 아무리 물결을 그려도 단조롭다.
   깊은 골은 짙은 남색, 얕은 여울은 옥색 — 이것만으로 바다가 살아난다 */
function fieldCanvas(W,H,ramp,gx,S){
  S=S||3;
  const w=Math.max(8,Math.round(W/S)), h=Math.max(8,Math.round(H/S));
  const gy=Math.max(4,Math.round(gx*H/W));
  const a=vnoise(w,h,gx,gy), b=vnoise(w,h,gx*2,gy*2), c2=vnoise(w,h,gx*4,gy*4);
  const cv2=document.createElement('canvas'); cv2.width=w; cv2.height=h;
  const cx=cv2.getContext('2d'), im=cx.createImageData(w,h);
  /* 색 띠를 256칸 표로 미리 펴 둔다 — 픽셀마다 띠를 훑으면 느리다 */
  const LUT=new Uint8Array(256*3);
  for(let i=0;i<256;i++){ const col=rampAt(ramp,i/255);
    LUT[i*3]=col[0]; LUT[i*3+1]=col[1]; LUT[i*3+2]=col[2]; }
  const D=im.data;
  for(let i=0;i<a.length;i++){
    let t=a[i]*.62+b[i]*.26+c2[i]*.12;
    t=t<0?0:t>1?255:(t*255)|0;
    const q=t*3, k=i*4;
    D[k]=LUT[q]; D[k+1]=LUT[q+1]; D[k+2]=LUT[q+2]; D[k+3]=255;
  }
  cx.putImageData(im,0,0);
  return cv2;
}
/* 넓게 번지는 색 변주 — 땅 전체가 한 가지 색이면 아무리 음영을 넣어도 단조롭다.
   아주 느린 잡음으로 두 색 사이를 오가게 해 구역마다 색이 달라 보이게 한다 */
function tintLayer(W,H,c1,c2,gx){
  const S=8, w=Math.max(6,Math.round(W/S)), h=Math.max(6,Math.round(H/S));
  const gy=Math.max(3,Math.round(gx*H/W));
  const n=vnoise(w,h,gx,gy);
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const cx=c.getContext('2d'), im=cx.createImageData(w,h);
  const A=hexRGB(c1), B=hexRGB(c2);
  for(let i=0;i<n.length;i++){
    const t=Math.max(0,Math.min(1,(n[i]-.25)*1.8)), k=i*4;
    im.data[k]  =A[0]+(B[0]-A[0])*t;
    im.data[k+1]=A[1]+(B[1]-A[1])*t;
    im.data[k+2]=A[2]+(B[2]-A[2])*t;
    im.data[k+3]=255;
  }
  cx.putImageData(im,0,0);
  return c;
}
/* 접지 그늘 — 물체가 땅에 닿는 자리를 부드럽게 어둡게 한다.
   딱딱한 드리움 그림자만 있으면 물체가 떠 보인다 */
function tao(c,x,y,rx,ry,a){
  const g2=c.createRadialGradient(x,y,0,x,y,Math.max(rx,ry));
  g2.addColorStop(0,'rgba(10,8,6,'+(a||.34)+')');
  g2.addColorStop(.55,'rgba(10,8,6,'+(a||.34)*.52+')');
  g2.addColorStop(1,'rgba(10,8,6,0)');
  c.save(); c.translate(x,y); c.scale(1,ry/Math.max(rx,ry)); c.translate(-x,-y);
  c.fillStyle=g2; c.beginPath(); c.arc(x,y,Math.max(rx,ry),0,TAU); c.fill(); c.restore();
}
function hexRGB(s){
  s=String(s).replace('#','');
  if(s.length===3) s=s[0]+s[0]+s[1]+s[1]+s[2]+s[2];
  const n=parseInt(s,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
/* ===== 하드 엣지 지형 =====
   둥근 ellipse 블롭은 4배로 확대되면 뭉개져 "콩알"처럼 보인다.
   모서리가 선 다각형 + 또렷한 드리움 그림자 + 1px 외곽선으로 바꾸면
   같은 해상도에서도 실루엣이 서고 도트 느낌이 산다 */
function trock(c,x,y,r,top,side,lit,sh){
  const n=5+rint(3), ang=[], rad=[];
  for(let i=0;i<n;i++){ ang.push(i/n*TAU+rnd(-.20,.20)); rad.push(r*rnd(.70,1.14)); }
  /* k 로 전체를 키워 외곽선을 '칠'로 두른다 — stroke 보다 가장자리가 또렷하다 */
  const path=(ox,oy,k)=>{ c.beginPath();
    for(let i=0;i<n;i++){ const q=rad[i]*(k||1);
      const px=Math.round(x+Math.cos(ang[i])*q+ox), py=Math.round(y+Math.sin(ang[i])*q*.74+oy);
      if(i) c.lineTo(px,py); else c.moveTo(px,py); }
    c.closePath(); };
  const ok=1+2.2/Math.max(6,r);
  tao(c,x+r*.18,y+r*.30,r*1.7,r*1.25,.30);          /* 접지 그늘 */
  c.fillStyle=sh||'rgba(24,16,6,.46)'; path(Math.round(r*.26),Math.round(r*.32),1); c.fill();
  c.fillStyle=TOUT; path(0,Math.round(r*.18),ok); c.fill(); path(0,0,ok); c.fill();
  c.fillStyle=side; path(0,Math.round(r*.18),1); c.fill();   /* 측면 */
  c.fillStyle=top;  path(0,0,1); c.fill();                   /* 윗면 */
  if(lit){ c.save(); path(0,0,1); c.clip(); c.fillStyle=lit;
    c.beginPath(); c.moveTo(x-r*1.2,y-r); c.lineTo(x+r*.25,y-r);
    c.lineTo(x-r*1.2,y+r*.35); c.closePath(); c.fill(); c.restore(); }
}
/* 위아래가 이어지는 세로 경로 — 타일이 반복돼도 선이 끊기지 않는다 (k 는 정수).
   TERRH 는 지금 굽고 있는 지형 타일의 높이다 */
function vpath(x0,amp,k,ph){
  const pts=[], hh=TERRH;
  for(let y=0;y<=hh;y+=8) pts.push([x0+Math.sin(y/hh*TAU*k+ph)*amp, y]);
  return pts;
}
/* 세로 구조물(길·활주로·강·균열) — 가장자리를 뚜렷하게 세운다 */
function tlane(c,pts,dy,w,col,edge){
  c.lineJoin='round'; c.lineCap='butt';
  if(edge){ c.strokeStyle=edge; c.lineWidth=w+4;
    c.beginPath(); for(const p of pts) c.lineTo(p[0],p[1]+dy); c.stroke(); }
  c.strokeStyle=col; c.lineWidth=w;
  c.beginPath(); for(const p of pts) c.lineTo(p[0],p[1]+dy); c.stroke();
}
/* 세로 구조물 위에 일정 간격 표식 — 32px 주기라 640 에서 딱 맞아떨어진다 */
function tmark(c,pts,dy,col,w,len,step){
  c.fillStyle=col; step=step||32;
  for(let y=0;y<TERRH;y+=step){ const p=pts[Math.round(y/8)]; if(!p) continue;
    c.fillRect(Math.round(p[0]-w/2),Math.round(p[1]+dy),w,len); }
}
/* 마을·보급 거점 — 건물 몇 채와 이어주는 길.
   같은 지형만 끝없이 이어지지 않게 하는 가장 값싼 장치다 */
function tcluster(c,x,y,n,roof,side,ground,road){
  const R=Math.round; x=R(x); y=R(y);
  const rad=14+n*5;
  if(ground){                                   /* 걷어낸 땅 */
    c.fillStyle=ground;
    c.beginPath(); c.ellipse(x,y,rad*1.5,rad*1.15,0,0,TAU); c.fill();
  }
  if(road){                                     /* 마을을 가로지르는 길 */
    c.fillStyle=TOUT;   c.fillRect(x-rad*1.6,y-4,rad*3.2,8);
    c.fillStyle=road;   c.fillRect(x-rad*1.6,y-3,rad*3.2,6);
  }
  const spots=[];
  for(let i=0;i<n;i++){
    const a=i/n*TAU+rnd(-.4,.4), q=rnd(.35,1.0);
    spots.push([R(x+Math.cos(a)*rad*q*1.3), R(y+Math.sin(a)*rad*q)]);
  }
  for(const [bx,by] of spots)
    tbuilding(c,bx-7,by-6,rnd(11,19),rnd(9,15),roof,side,.0);
}
/* 다리 — 세로 구조물(강·협곡)을 가로지른다 */
function tbridge(c,pts,dy,y,w,col){
  const p=pts[Math.round(y/8)%pts.length]; if(!p) return;
  const R=Math.round, cx=R(p[0]), cy=R(p[1]+dy);
  c.fillStyle='rgba(10,14,10,.45)'; c.fillRect(cx-w/2,cy+3,w,11);
  c.fillStyle=TOUT; c.fillRect(cx-w/2-1,cy-7,w+2,15);
  c.fillStyle=col;  c.fillRect(cx-w/2,cy-6,w,13);
  c.fillStyle='rgba(255,255,255,.12)'; c.fillRect(cx-w/2,cy-6,w,3);
  c.fillStyle=TOUT;
  for(let k=-1;k<=1;k+=2) c.fillRect(cx+k*(w/2-3)-1,cy-7,2,15);
}
/* 요새·기지 — 외벽과 모서리 포탑, 안쪽 건물. 참고 이미지의 사막 요새에 해당한다 */
function tfort(c,x,y,w,h,wall,wallD,inner,innerD){
  const R=Math.round;
  tao(c,x+w*.55,y+h*.60,Math.max(w,h)*1.1,Math.max(w,h)*.85,.30);
  c.fillStyle='rgba(20,14,4,.46)'; c.fillRect(R(x+w*.06),R(y+h*.09),R(w),R(h));
  c.fillStyle=TOUT;  c.fillRect(R(x)-2,R(y)-2,R(w)+4,R(h)+4);
  c.fillStyle=wallD; c.fillRect(R(x),R(y),R(w),R(h));
  c.fillStyle=wall;  c.fillRect(R(x),R(y),R(w),R(h*.86));
  /* 성벽 위 통로와 총안 — 벽이 두께를 갖게 한다 */
  const wt=Math.max(3,R(Math.min(w,h)*.13));
  c.fillStyle=tmix(wall,.18);
  c.fillRect(R(x),R(y),R(w),wt); c.fillRect(R(x),R(y+h)-wt,R(w),wt);
  c.fillRect(R(x),R(y),wt,R(h)); c.fillRect(R(x+w)-wt,R(y),wt,R(h));
  c.fillStyle=tmix(wall,-.40);                       /* 총안 — 톱니처럼 파낸 자리 */
  for(let k=R(x)+2;k<R(x+w)-3;k+=6){ c.fillRect(k,R(y),3,2); c.fillRect(k,R(y+h)-2,3,2); }
  for(let k=R(y)+2;k<R(y+h)-3;k+=6){ c.fillRect(R(x),k,2,3); c.fillRect(R(x+w)-2,k,2,3); }
  /* 성문 */
  c.fillStyle=TOUT;
  c.fillRect(R(x+w*.42),R(y+h)-wt-1,R(w*.16),wt+2);
  c.fillStyle=tmix(innerD,-.2);
  c.fillRect(R(x+w*.44),R(y+h)-wt,R(w*.12),wt);
  /* 안마당 */
  c.fillStyle=innerD; c.fillRect(R(x)+wt,R(y)+wt,R(w)-wt*2,R(h)-wt*2);
  c.fillStyle=tmix(innerD,.14);                      /* 안마당 길 */
  c.fillRect(R(x+w*.46),R(y)+wt,R(w*.08),R(h)-wt*2);
  c.fillStyle=tmix(innerD,-.16);                     /* 포장 자국 */
  for(let k=R(y)+wt+4;k<R(y+h)-wt-2;k+=5) c.fillRect(R(x)+wt,k,R(w)-wt*2,1);
  /* 모서리 포탑 */
  const tr=Math.max(5,Math.min(w,h)*.18);
  for(const [tx,ty] of [[x,y],[x+w,y],[x,y+h],[x+w,y+h]]){
    c.fillStyle='rgba(20,14,4,.46)'; c.fillRect(R(tx-tr+tr*.3),R(ty-tr+tr*.4),R(tr*2),R(tr*2));
    c.fillStyle=TOUT;  c.fillRect(R(tx-tr)-2,R(ty-tr)-2,R(tr*2)+4,R(tr*2)+4);
    c.fillStyle=wallD; c.fillRect(R(tx-tr),R(ty-tr),R(tr*2),R(tr*2));
    c.fillStyle=wall;  c.fillRect(R(tx-tr),R(ty-tr),R(tr*2),R(tr*1.6));
    c.fillStyle=tmix(wall,.22);                      /* 포탑 지붕 */
    c.fillRect(R(tx-tr)+2,R(ty-tr)+2,R(tr*2)-4,R(tr*2)-5);
    c.fillStyle=TOUT;                                /* 포구 */
    c.fillRect(R(tx)-1,R(ty-tr)+2,2,R(tr*1.1));
    c.fillStyle='rgba(255,255,255,.18)';
    c.fillRect(R(tx-tr),R(ty-tr),R(tr*2),1);
  }
  /* 안쪽 구조물 — 막사와 보급품 */
  const slots=[[.21,.22],[.58,.22],[.21,.58],[.58,.58]];
  for(const [sx,sy] of slots){
    if(Math.random()<.22) continue;                  /* 한두 칸은 비워 둔다 */
    const bw=R(w*rnd(.17,.23)), bh=R(h*rnd(.15,.21));
    tbuilding(c,R(x+w*sx),R(y+h*sy),bw,bh,inner,tmix(inner,-.42),0);
  }
  for(let i=0;i<4;i++){                              /* 보급 상자 */
    const q=Math.max(2,R(Math.min(w,h)*.09));
    troofbox(c,R(x+w*(.22+rnd(0,.56))),R(y+h*(.26+rnd(0,.48))),q,q,tmix(inner,-.22));
  }
}
/* 산 하나 — 예전에는 타원 네 겹이라 '회색 달걀'로 보였다.
   능선을 각지게 깎고 빛 받는 면과 그늘진 면을 칼같이 나눈다 */
function trelief(c,x,y,rx,ry,rot,base,dark,lit,peak){
  const n=7, pts=[];
  for(let i=0;i<n;i++){
    const a=i/n*TAU+rnd(-.22,.22), q=rnd(.74,1.12);
    const px=Math.cos(a)*rx*q, py=Math.sin(a)*ry*q;
    pts.push([Math.round(x+px*Math.cos(rot)-py*Math.sin(rot)),
              Math.round(y+px*Math.sin(rot)+py*Math.cos(rot))]);
  }
  const path=(ox,oy,k)=>{ c.beginPath();
    for(let i=0;i<n;i++){
      const px=Math.round(x+(pts[i][0]-x)*(k||1)+ox), py=Math.round(y+(pts[i][1]-y)*(k||1)+oy);
      if(i) c.lineTo(px,py); else c.moveTo(px,py); }
    c.closePath(); };
  tao(c,x+rx*.2,y+ry*.3,rx*1.6,ry*1.5,.30);
  c.fillStyle='rgba(14,12,10,.38)'; path(Math.round(rx*.22),Math.round(ry*.30)); c.fill();
  c.fillStyle=TOUT; path(0,0,1+2.4/Math.max(10,rx)); c.fill();
  c.fillStyle=dark; path(0,0); c.fill();
  /* 빛 받는 면 — 정상에서 북서쪽으로 뻗은 쐐기 */
  const px=Math.round(x-rx*.18), py=Math.round(y-ry*.22);
  c.save(); path(0,0); c.clip();
  c.fillStyle=base;
  c.beginPath(); c.moveTo(px,py);
  c.lineTo(px-rx*1.4,py-ry*1.4); c.lineTo(px-rx*1.5,py+ry*1.1); c.closePath(); c.fill();
  c.fillStyle=lit;
  c.beginPath(); c.moveTo(px,py);
  c.lineTo(px-rx*.95,py-ry*1.0); c.lineTo(px-rx*1.05,py+ry*.45); c.closePath(); c.fill();
  c.restore();
  if(peak){ c.fillStyle=peak;
    c.beginPath(); c.moveTo(px,py-ry*.30);
    c.lineTo(px+rx*.26,py+ry*.16); c.lineTo(px-rx*.30,py+ry*.20); c.closePath(); c.fill(); }
}
function trange(c,x0,y0,n,ang,sc,base,dark,lit,peak){
  let x=x0,y=y0;
  for(let i=0;i<n;i++){
    const rx=sc*rnd(.7,1.35), ry=rx*rnd(.5,.8);
    trelief(c,x,y,rx,ry,rnd(0,PI),base,dark,lit,peak);
    x+=Math.cos(ang)*rx*rnd(1.0,1.5);
    y+=Math.sin(ang)*rx*rnd(.5,1.1);
  }
}
const MW=18, MH=32;                     /* 지형 종류 격자(물/육지) — 화면 1장 기준 */
let TERRH=H, TMH=MH;                    /* 지금 굽고 있는 타일의 높이·격자 행수 */
function maskSet(mask,x,y,rx,ry,v){
  for(let cy=0;cy<TMH;cy++) for(let cx=0;cx<MW;cx++){
    const px=(cx+.5)/MW*W, py=(cy+.5)/TMH*TERRH;
    let dy=py-y; if(dy>TERRH/2) dy-=TERRH; if(dy<-TERRH/2) dy+=TERRH;
    if(((px-x)/rx)**2+(dy/ry)**2<=1) mask[cy*MW+cx]=v;
  }
}
/* t 는 terrain 객체 — 타일마다 높이와 격자 행수가 다르므로 함께 들고 다닌다 */
function maskAt(t,x,ty){
  const cx=clamp(Math.floor(x/W*MW),0,MW-1);
  const cy=((Math.floor(ty/t.th*t.mh)%t.mh)+t.mh)%t.mh;
  return t.mask[cy*MW+cx];
}
function makeTerrain(theme,tiles){
  /* 이 함수 안에서 H 는 '화면 높이'가 아니라 '타일 높이'다.
     아래 지형 코드는 전부 H 를 세로 범위로 쓰므로, 이렇게 가려두면
     타일을 길게 만드는 데 코드를 고칠 필요가 없다 */
  const TIL=tiles||TERR_TILES, H=SCREEN_H*TIL;
  TERRH=H; TMH=MH*TIL;
  /* 외곽선도 테마 색조로 — 모든 테마에 같은 검정을 쓰면 그림이 딱딱해진다 */
  { const t0=THEMES.find(t=>t.id===theme); TOUT=(t0&&t0.ink)||'#15120c'; }
  const base=document.createElement('canvas'); base.width=W*RS; base.height=H*RS;
  const det =document.createElement('canvas'); det.width=W*RS;  det.height=H*RS;
  const g=base.getContext('2d'), d=det.getContext('2d');
  g.imageSmoothingEnabled=false; d.imageSmoothingEnabled=false;
  g.scale(RS,RS); d.scale(RS,RS);
  const wrap=fn=>{ for(const dy of [-H,0,H]) fn(dy); };
  const water=(theme==='sea'||theme==='isle'||theme==='harbor');
  const mask=new Uint8Array(MW*TMH).fill(water?1:0);   /* 1=물 0=육지 */

  if(theme==='sea'||theme==='isle'||theme==='harbor'){
    /* ---------- 바다 ----------
       예전에는 한 가지 파랑으로 채우고 물결 선만 얹었다. 그래서 단조로웠다.
       이제 깊이 분포를 먼저 칠한다 — 깊은 골은 짙은 남색, 얕은 여울은 옥색 */
    const SEARAMP=[[0,'#0b2f48'],[.26,'#13536e'],[.48,'#1c7c88'],[.66,'#2ba3a2'],
                   [.82,'#4ec6b6'],[1,'#8ae4cc']];
    { const bed=fieldCanvas(W,H,SEARAMP,4,3);
      g.save(); g.imageSmoothingEnabled=true; g.drawImage(bed,0,0,W,H); g.restore(); }
    /* 해류 — 깊이 위에 흐름을 얹는다. 색칠이 깊이를 맡았으니 옅게만 */
    for(let i=0;i<5*TIL;i++){
      const pts=vpath(rnd(0,W),rnd(26,62),1+rint(2),rnd(0,TAU));
      wrap(dy=>{ tlane(g,pts,dy,rnd(26,54),'rgba(8,34,44,.16)'); }); }
    for(let i=0;i<4*TIL;i++){
      const pts=vpath(rnd(0,W),rnd(22,52),1+rint(2),rnd(0,TAU));
      wrap(dy=>{ tlane(g,pts,dy,rnd(16,36),'rgba(96,190,186,.12)'); }); }
    /* 모래톱 — 물 밑으로 비치는 얕은 둔덕 */
    for(let i=0;i<7*TIL;i++){ const x=rnd(0,W), y=rnd(0,H), rx=rnd(26,74), ry=rnd(12,34);
      wrap(dy=>{
        const rot=rnd(-.4,.4);
        g.save(); g.globalAlpha=.46; g.fillStyle='#5ec4b0';
        g.beginPath(); g.ellipse(x,y+dy,rx,ry,rot,0,TAU); g.fill();
        g.globalAlpha=.42; g.fillStyle='#96ddc6';
        g.beginPath(); g.ellipse(x-rx*.1,y+dy-ry*.12,rx*.62,ry*.58,rot,0,TAU); g.fill();
        g.globalAlpha=.34; g.fillStyle='#d2f0dd';
        g.beginPath(); g.ellipse(x-rx*.16,y+dy-ry*.2,rx*.3,ry*.3,rot,0,TAU); g.fill();
        g.restore(); }); }
    /* 암초 — 각진 실루엣으로 물 위에 점을 찍는다 */
    for(let i=0;i<11*TIL;i++){ const x=rnd(0,W), y=rnd(0,H), r=rnd(7,16);
      wrap(dy=>{ g.fillStyle='rgba(120,206,196,.16)';
        g.beginPath(); g.ellipse(x,y+dy,r*1.8,r*1.4,0,0,TAU); g.fill();
        trock(g,x,y+dy,r,'#2f6a63','#1d4a46','#4e9089','rgba(6,28,32,.5)'); }); }
    /* 너울 — 가로로 줄 맞춘 물마루.
       짧은 선을 흩뿌리면 '점'으로 보인다. 줄을 맞춰야 파도로 읽힌다.
       마루 아래에 골 그림자를 붙여 물이 부풀어 보이게 한다 */
    g.lineCap='round'; g.lineJoin='round';
    for(let yy=0;yy<H;yy+=20){
      if(Math.random()<.46) continue;              /* 줄을 드문드문 — 빽빽하면 빗금이 된다 */
      const ph=rnd(0,TAU), amp=rnd(2.0,5.0), wob=rnd(.022,.044);
      let x=rnd(-120,0);
      while(x<W+24){
        const seg=rnd(60,170);
        const cy=t=>yy+Math.sin(t*wob+ph)*amp;
        g.strokeStyle='rgba(4,26,36,.30)'; g.lineWidth=3.0;   /* 골 */
        g.beginPath(); for(let k=0;k<=seg;k+=5) g.lineTo(x+k,cy(x+k)+2.6); g.stroke();
        g.strokeStyle='rgba(234,254,252,.50)'; g.lineWidth=1.6; /* 마루 */
        g.beginPath(); for(let k=0;k<=seg;k+=5) g.lineTo(x+k,cy(x+k)); g.stroke();
        x+=seg+rnd(45,130);
      }
    }
    /* 윤슬 — 해가 비치는 띠에만 잔 반짝임이 모인다 */
    for(let i=0;i<420*TIL;i++){
      const px=rnd(0,W), py=rnd(0,H);
      const band=Math.exp(-Math.pow((px-(W*.33+Math.sin(py*.0045)*64))/105,2));
      if(Math.random()>band*.85) continue;
      g.fillStyle='rgba(255,250,214,'+rnd(.30,.78)+')';
      g.fillRect(Math.round(px),Math.round(py),1+rint(3),1);
    }
    /* 흰 포말 — 윗층에서 더 빨리 흘러 깊이를 만든다 */
    for(let i=0;i<150*TIL;i++){ const x=rnd(0,W), y=rnd(0,H);
      d.fillStyle='rgba(255,255,255,'+rnd(.12,.34)+')';
      wrap(dy=>{ d.beginPath(); d.ellipse(x,y+dy,rnd(3,10),rnd(1.4,3.4),0,0,TAU); d.fill(); }); }

    if(theme==='isle'){
      for(let i=0;i<5*TIL;i++){
        /* 섬마다 성격을 다르게 — 전부 같은 모양이면 열두 번 같은 섬을 지난다.
           0 민둥섬 · 1 수풀섬 · 2 환초(가운데 석호) · 3 마을섬 · 4 비행장섬 */
        const KIND=[0,1,1,2,3,3,4][rint(7)];
        const big=(KIND===4||KIND===2);
        const x=rnd(36,W-36), y=rnd(0,H);
        const rw=big?rnd(84,124):rnd(26,96), rh=big?rnd(62,92):rnd(20,70), rot=rnd(0,1);
        maskSet(mask,x,y,rw*1.15,rh*1.15,0);
        /* 완벽한 타원은 인공적으로 보인다 — 가장자리를 들쭉날쭉하게 만든다 */
        const NP=14, jit=[];
        for(let k=0;k<NP;k++) jit.push(rnd(.80,1.16));
        const shape=(sx,ox,oy,dy)=>{ g.beginPath();
          for(let k=0;k<NP;k++){
            const a=k/NP*TAU, q=jit[k]*sx;
            const px=Math.cos(a)*rw*q, py=Math.sin(a)*rh*q;
            const rx=px*Math.cos(rot)-py*Math.sin(rot), ry=px*Math.sin(rot)+py*Math.cos(rot);
            if(k) g.lineTo(x+rx+ox,y+dy+ry+oy); else g.moveTo(x+rx+ox,y+dy+ry+oy);
          } g.closePath(); };
        wrap(dy=>{
          const R=Math.round;
          g.fillStyle='rgba(6,34,42,.5)';  shape(1.24,8,10,dy); g.fill();
          g.fillStyle='#2f7d80';           shape(1.18,0,0,dy);  g.fill();   /* 얕은 바다 */
          /* 파도가 부서지는 흰 테 — 먼저 통으로 깔고 모래가 가운데를 덮게 한다.
             나중에 지우개(destination-out)로 뚫으면 섬까지 지워진다 */
          g.fillStyle='rgba(236,250,252,.55)'; shape(1.11,0,0,dy); g.fill();
          g.fillStyle='#0f3945';           shape(1.05,0,0,dy);  g.fill();   /* 물가 외곽 */
          g.fillStyle='#e2d29a';           shape(1.00,0,0,dy);  g.fill();   /* 모래 */
          g.fillStyle='#c9b681';           shape(.96,4,5,dy);   g.fill();
          if(KIND!==0){ g.fillStyle='#2a4c28'; shape(.84,0,0,dy); g.fill();
                        g.fillStyle='#3d6b3a'; shape(.80,0,0,dy); g.fill(); }  /* 수풀 */
          if(KIND===2){                                   /* 환초 — 가운데 석호 */
            g.fillStyle='#2f7d80'; shape(.46,0,0,dy); g.fill();
            g.fillStyle='#17596a'; shape(.34,0,0,dy); g.fill();
          }
          if(KIND!==2&&KIND!==4)
            for(let k=0;k<(KIND?20:5);k++){ const a=rnd(0,TAU), q=rnd(0,.70);
              ttree(g,x+Math.cos(a)*rw*q,y+dy+Math.sin(a)*rh*q,rnd(4,10),'#2d5530','#4b8149'); }
          if(KIND===3){                                   /* 마을섬 — 집과 부두 */
            tcluster(g,x,y+dy,3+rint(3),'#9a6a42','#4e3523',null,'#b8a476');
            const px=R(x+rw*.9), py=R(y+dy);
            g.fillStyle=TOUT;   g.fillRect(px-2,py-4,R(rw*.45),9);
            g.fillStyle='#7a6a4c'; g.fillRect(px-1,py-3,R(rw*.45)-2,7);
            for(let k=0;k<4;k++) g.fillRect(px+k*R(rw*.12),py+4,2,5);
            for(let k=0;k<10;k++){ const a=rnd(0,TAU), q=rnd(.3,.72);
              ttree(g,x+Math.cos(a)*rw*q,y+dy+Math.sin(a)*rh*q,rnd(4,9),'#2d5530','#4b8149'); }
          }
          if(KIND===4){                                   /* 비행장섬 */
            const aw=20, ah=R(rh*1.5);
            g.fillStyle='#6b7a4a'; g.fillRect(R(x)-26,R(y+dy)-R(ah/2)-6,52,ah+12);
            g.fillStyle=TOUT;     g.fillRect(R(x)-aw/2-1,R(y+dy)-R(ah/2)-1,aw+2,ah+2);
            g.fillStyle='#75705f';g.fillRect(R(x)-aw/2,R(y+dy)-R(ah/2),aw,ah);
            g.fillStyle='rgba(248,246,228,.72)';
            for(let k=R(y+dy)-R(ah/2)+10;k<R(y+dy)+R(ah/2)-10;k+=32) g.fillRect(R(x)-1,k,2,14);
            for(let k=0;k<3;k++)
              tbuilding(g,R(x)+16,R(y+dy)-R(ah/2)+R(ah*(.18+k*.3)),rnd(14,20),rnd(10,14),
                '#5d6b55','#2f3a28',.0);
          }
        });
      }
      /* 난파선 — 넓은 바다에 사건을 하나씩 둔다 */
      for(let i=0;i<2*TIL;i++){
        const x=rnd(40,W-40), y=rnd(0,H), a=rnd(-.6,.6);
        wrap(dy=>{ g.save(); g.translate(Math.round(x),Math.round(y+dy)); g.rotate(a);
          g.fillStyle='rgba(6,30,38,.55)';
          g.beginPath(); g.ellipse(4,6,26,12,0,0,TAU); g.fill();
          g.fillStyle=TOUT;   g.fillRect(-9,-28,18,54);
          g.fillStyle='#4a4a42'; g.fillRect(-8,-27,16,52);
          g.fillStyle='#5e5e54'; g.fillRect(-8,-27,8,52);
          g.fillStyle='#2b2b26'; g.fillRect(-8,-6,16,9);     /* 꺾여 잠긴 중앙 */
          g.fillStyle='rgba(120,200,200,.22)'; g.fillRect(-9,2,18,24);
          g.restore(); }); }
    }
    if(theme==='harbor'){
      /* 방파제 — 화면을 세로로 관통해 항만의 뼈대를 만든다 */
      { const bx=rnd(W*.34,W*.66), pts=vpath(bx,rnd(10,26),1,rnd(0,TAU));
        maskSet(mask,bx,H*.5,34,H,0);
        wrap(dy=>{
          tlane(g,pts,dy,20,'#4e4b40','rgba(4,24,30,.7)');
          tlane(g,pts,dy,13,'#625e50');
          g.fillStyle='#39372e';
          for(let y=0;y<H;y+=16){ const p=pts[Math.round(y/8)]; if(!p) continue;
            g.fillRect(Math.round(p[0]-9),Math.round(p[1]+dy),18,3); }
          for(let y=0;y<H;y+=160){ const p=pts[Math.round(y/8)]; if(!p) continue;
            g.fillStyle='#b8452c'; g.fillRect(Math.round(p[0])-4,Math.round(p[1]+dy)-9,8,18);
            g.fillStyle='#f0d070'; g.fillRect(Math.round(p[0])-2,Math.round(p[1]+dy)-7,4,5); }

      wrap(dy=>{ tlane(g,pts,dy,11,'#6f6a62','rgba(40,48,58,.6)');
        tmark(g,pts,dy,'rgba(44,38,32,.75)',13,3,16);

    { const fx=rnd(20,W-100), fy=rnd(0,H), fw=rnd(60,88);
      wrap(dy=>tfort(g,fx,fy+dy,fw,fw*rnd(.8,1.1),'#8c99a6','#55616d','#e4eef6','#66727e')); }
    for(let i=0;i<26*TIL;i++){ const x=rnd(0,W), y=rnd(0,H);
      wrap(dy=>tconifer(d,x,y+dy,rnd(9,14))); }

  } else if(theme==='volcano'){
    const gr=g.createLinearGradient(0,0,W,H);
    gr.addColorStop(0,'#3d332d'); gr.addColorStop(.5,'#332b26'); gr.addColorStop(1,'#2a231f');

    for(let i=0;i<100*TIL;i++){ const x=rnd(0,W), y=rnd(0,H);

    /* 용암이 흐르는 큰 균열 — 화면을 세로로 관통하는 이 테마의 중심선 */
    for(let i=0;i<2*TIL;i++){

    for(let i=0;i<14*TIL;i++){ const x=rnd(0,W), y=rnd(0,H), r=rnd(20,48);

    for(let i=0;i<70*TIL;i++){ const x=rnd(0,W), y=rnd(0,H);

    for(let i=0;i<2*TIL;i++){ const x0=rnd(0,W), y0=rnd(0,H), an=rnd(-.5,.5);
      wrap(dy=>trange(g,x0,y0+dy,6,an,rnd(30,46),'#3d332e','#2a2320','#544741','#6b5b52')); }
    for(let i=0;i<2*TIL;i++){ const cx=rnd(50,W-50), cy=rnd(0,H), cr=rnd(34,52);
      wrap(dy=>{
        trelief(g,cx,cy+dy,cr,cr*.72,0,'#453931','#312722','#5c4c43','#6e5b50');
        const rg=g.createRadialGradient(cx,cy+dy,0,cx,cy+dy,cr*.52);
        rg.addColorStop(0,'rgba(255,214,110,.95)'); rg.addColorStop(.5,'rgba(255,96,20,.75)');
        rg.addColorStop(1,'rgba(120,30,8,0)');
        g.fillStyle=rg; g.beginPath(); g.ellipse(cx,cy+dy,cr*.52,cr*.38,0,0,TAU); g.fill(); }); }
    for(let i=0;i<24*TIL;i++){ const x=rnd(0,W), y=rnd(0,H);
      wrap(dy=>{ d.fillStyle='rgba(0,0,0,.5)';
        d.beginPath(); d.moveTo(x+8,y+dy+10); d.lineTo(x+30,y+dy+18); d.lineTo(x+10,y+dy-14);
        d.closePath(); d.fill();
        d.fillStyle='#463c35';
        d.beginPath(); d.moveTo(x,y+dy-18); d.lineTo(x+13,y+dy+14); d.lineTo(x-13,y+dy+14);
        d.closePath(); d.fill();
        d.fillStyle='#5c4f46';
        d.beginPath(); d.moveTo(x-2,y+dy-15); d.lineTo(x+5,y+dy+12); d.lineTo(x-10,y+dy+12);
        d.closePath(); d.fill(); }); }

  } else if(theme==='night'){
    /* 야간 공업지대 — 낮 도시와 같은 격자를 쓰되 불빛으로만 형태를 읽게 한다 */
    const NW=72, NH=80;
    g.fillStyle='#0b0f16'; g.fillRect(0,0,W,H);
    for(let bx=0;bx<W;bx+=NW) for(let by=0;by<H;by+=NH){
      g.fillStyle=['#141a24','#111721','#171d28'][rint(3)];
      g.fillRect(bx+6,by+6,NW-12,NH-12);
    }
    /* 가로등이 늘어선 간선도로 — 어둠 속 유일한 안내선 */
    { const pts=vpath(Math.round(rnd(1,4))*NW,rnd(8,22),1,rnd(0,TAU));
      wrap(dy=>{ tlane(g,pts,dy,20,'#1a202b','rgba(4,6,10,.8)');
        for(let y=0;y<H;y+=32){ const p=pts[Math.round(y/8)]; if(!p) continue;
          const lx=Math.round(p[0]), ly=Math.round(p[1]+dy);
          const rg=g.createRadialGradient(lx,ly,0,lx,ly,15);
          rg.addColorStop(0,'rgba(255,224,150,.55)'); rg.addColorStop(1,'rgba(255,200,110,0)');
          g.fillStyle=rg; g.beginPath(); g.arc(lx,ly,15,0,TAU); g.fill();
          g.fillStyle='rgba(255,238,190,.9)'; g.fillRect(lx-1,ly-1,2,2); } }); }
    for(let bx=0;bx<W;bx+=NW) for(let by=0;by<H;by+=NH){
      const n=2+rint(4);
      for(let k=0;k<n;k++){
        const bw=rnd(16,30), bh=rnd(14,28);
        const x=bx+8+rnd(0,NW-18-bw), y=by+8+rnd(0,NH-18-bh);
        wrap(dy=>tbuilding(g,x,y+dy,bw,bh,'#1f252e','#121720',.4,'rgba(255,208,116,.95)'));
      }
    }
    for(let i=0;i<16*TIL;i++){ const x=rnd(0,W), y=rnd(0,H), r=rnd(26,76);
      wrap(dy=>{ const rg=g.createRadialGradient(x,y+dy,0,x,y+dy,r);
        rg.addColorStop(0,'rgba(255,158,54,.62)'); rg.addColorStop(1,'rgba(255,92,20,0)');
        g.fillStyle=rg; g.beginPath(); g.arc(x,y+dy,r,0,TAU); g.fill(); }); }
    for(let i=0;i<5*TIL;i++){ const x=rnd(20,W-20), y=rnd(0,H);
      wrap(dy=>{ d.save(); d.translate(x,y+dy); d.rotate(rnd(-.6,.6));
        const rg=d.createLinearGradient(0,0,0,-320);
        rg.addColorStop(0,'rgba(255,250,214,.34)'); rg.addColorStop(1,'rgba(255,250,214,0)');
        d.fillStyle=rg; d.beginPath(); d.moveTo(-7,0); d.lineTo(-50,-320);
        d.lineTo(50,-320); d.lineTo(7,0); d.closePath(); d.fill();
        d.fillStyle='rgba(255,250,214,.85)'; d.beginPath(); d.arc(0,0,4,0,TAU); d.fill();
        d.restore(); }); }

  } else {  /* city — 가로망을 깔고 그 안에 건물을 채운다.
               무작위로 흩뿌리면 돌무더기처럼 보이지만, 길이 생기면 도시로 읽힌다.
               격자 간격 72·80 은 360·640 을 정확히 나눠 떨어뜨려 이음매가 없다 */
    const CW=72, CH=80;
    g.fillStyle='#3a3934'; g.fillRect(0,0,W,H);              /* 노면 */
    /* 블록 바닥 */
    for(let bx=0;bx<W;bx+=CW) for(let by=0;by<H;by+=CH){
      g.fillStyle=['#50504a','#4a4a44','#565650'][rint(3)];
      g.fillRect(bx+7,by+7,CW-14,CH-14);
    }
    /* 큰길 — 중앙선이 있는 간선도로 하나 */
    const avX=Math.round(rnd(1,4))*CW;
    g.fillStyle='#2f2e2a'; g.fillRect(avX-13,0,26,H);
    g.fillStyle='rgba(236,226,180,.45)';
    for(let y=0;y<H;y+=32) g.fillRect(avX-1,y,2,16);
    /* 가로 도로 표식 */
    g.fillStyle='rgba(226,216,176,.26)';
    for(let y=0;y<H;y+=CH) for(let x=4;x<W;x+=18) g.fillRect(x,y-1,9,2);
    /* 블록 안 건물 — 지붕색을 갈라 회색 일변도를 깬다 */
    const ROOF=[['#8a5a46','#4a3028'],['#6f7f72','#3b4740'],['#8d8a74','#4a4840'],
                ['#9a8456','#53462b'],['#6a7488','#383f4c'],['#7d6a7a','#433a42']];
    for(let bx=0;bx<W;bx+=CW) for(let by=0;by<H;by+=CH){
      const n=2+rint(4);
      for(let k=0;k<n;k++){
        const bw=rnd(16,30), bh=rnd(14,28);
        const x=bx+9+rnd(0,CW-20-bw), y=by+9+rnd(0,CH-20-bh), c=ROOF[rint(ROOF.length)];
        wrap(dy=>tbuilding(g,x,y+dy,bw,bh,c[0],c[1],.3,'rgba(255,244,210,.18)'));
      }
    }
    /* 요새 성벽 — 테마 이름값을 하는 구조물 */
    { const wy=Math.round(rnd(0,7))*CH, R=Math.round;
      wrap(dy=>{
        g.fillStyle='rgba(12,12,10,.45)'; g.fillRect(0,R(wy+dy)+4,W,16);
        g.fillStyle='#6b6456'; g.fillRect(0,R(wy+dy),W,14);
        g.fillStyle='#857d6b'; g.fillRect(0,R(wy+dy),W,8);
        g.fillStyle='#4a4439';                                /* 총안 */
        for(let x=3;x<W;x+=12) g.fillRect(x,R(wy+dy),6,4);
        g.strokeStyle='rgba(16,16,12,.7)'; g.lineWidth=1;
        g.strokeRect(.5,R(wy+dy)+.5,W-1,14);
        for(let k=0;k<4;k++){                                  /* 성벽 포탑 */
          const tx=R(rnd(20,W-40));
          g.fillStyle='rgba(12,12,10,.45)'; g.fillRect(tx+3,R(wy+dy)-8,22,30);
          g.fillStyle='#5e5849'; g.fillRect(tx,R(wy+dy)-11,22,30);
          g.fillStyle='#7b7362'; g.fillRect(tx,R(wy+dy)-11,22,18);
          g.strokeStyle='rgba(16,16,12,.7)'; g.strokeRect(tx+.5,R(wy+dy)-10.5,22,30);
        }
      }); }
    /* 공원 — 초록으로 숨구멍을 준다 */
    for(let i=0;i<5*TIL;i++){ const bx=Math.round(rnd(0,4))*CW, by=Math.round(rnd(0,7))*CH;
      wrap(dy=>{ g.fillStyle='#3e5330'; g.fillRect(bx+8,by+dy+8,CW-16,CH-16);
        for(let k=0;k<11;k++)
          ttree(g,bx+12+rnd(0,CW-24),by+dy+12+rnd(0,CH-24),rnd(5,9),'#2f4a2c','#4e7442'); }); }
    /* 고층 건물 — 윗층에 올려 높이감을 만든다 */
    for(let i=0;i<16*TIL;i++){ const x=rnd(10,W-44), y=rnd(0,H), c=ROOF[rint(ROOF.length)];
      wrap(dy=>tbuilding(d,x,y+dy,rnd(22,36),rnd(38,66),c[0],c[1],.34,'rgba(255,240,200,.26)')); }
  }
  /* ---------- 사람이 사는 흔적 ----------
     테마마다 마을·보급 거점을 흩어 둔다. 빈 들판만 이어지면
     '장소'로는 읽혀도 지나가는 재미가 없다 */
  const SETTLE={
    jungle :{roof:'#7a6238',side:'#3a2f1e',ground:'#53663b',road:'#6e6244'},
    land   :{roof:'#9a6340',side:'#55382a',ground:'#6d7a4a',road:'#948c76'},
    desert :{roof:'#c69a5c',side:'#6e5430',ground:'#c2a269',road:'#b2905a'},
    snow   :{roof:'#8c9aaa',side:'#4a5664',ground:'#dbe8f2',road:'#8d8a82'},
    volcano:{roof:'#6f5d52',side:'#332a24',ground:'#4a3f38',road:'#5a4c44'},
    night  :{roof:'#232a36',side:'#131820',ground:'#141a24',road:'#1e242e'}
  };
  const ST=SETTLE[theme];
  if(ST) for(let i=0;i<4*TIL;i++){
    const x=rnd(44,W-44), y=rnd(0,H), n=3+rint(4);
    wrap(dy=>tcluster(g,x,y+dy,n,ST.roof,ST.side,ST.ground,ST.road));
  }
  /* ---------- 전흔 ----------
     같은 지형이 끝없이 이어지면 '장소'는 있어도 '변화'가 없다.
     포탄 구덩이·불탄 자국·격파된 차량을 흩어 두면 지나가는 동안
     풍경이 조금씩 달라 보인다 */
  if(!water){
    const R=Math.round;
    /* 구덩이 색은 테마의 어두운 색을 쓴다 — 어디서나 새까맣게 찍으면
       설원 같은 밝은 지형에서 검은 점처럼 튄다 */
    const TD=THEMES.find(t=>t.id===theme), CR=TD.deep;
    for(let i=0;i<20*TIL;i++){            /* 포탄 구덩이 */
      const x=rnd(0,W), y=rnd(0,H), r=rnd(5,12);
      wrap(dy=>{
        g.globalAlpha=.55; g.fillStyle=CR;
        g.beginPath(); g.ellipse(R(x),R(y+dy),r*1.3,r*1.0,0,0,TAU); g.fill();
        g.globalAlpha=.85;
        g.beginPath(); g.ellipse(R(x),R(y+dy),r,r*.78,0,0,TAU); g.fill();
        g.globalAlpha=.42; g.fillStyle='#c8b894';
        g.beginPath(); g.ellipse(R(x)-1,R(y+dy)-1,r*.52,r*.40,0,0,TAU); g.fill();
        g.globalAlpha=1;
      }); }
    for(let i=0;i<9*TIL;i++){             /* 불탄 자국 */
      const x=rnd(0,W), y=rnd(0,H), r=rnd(16,34);
      wrap(dy=>{ g.fillStyle='rgba(26,20,14,.26)';
        g.beginPath(); g.ellipse(R(x),R(y+dy),r,r*.72,rnd(0,PI),0,TAU); g.fill(); }); }
    for(let i=0;i<7*TIL;i++){             /* 격파된 차량 */
      const x=rnd(12,W-12), y=rnd(0,H), a=rnd(0,PI);
      wrap(dy=>{ g.save(); g.translate(R(x),R(y+dy)); g.rotate(a);
        g.fillStyle='rgba(18,14,8,.5)'; g.fillRect(-6,-4,16,11);
        g.fillStyle=TOUT;    g.fillRect(-9,-6,19,13);
        g.fillStyle='#3a362d'; g.fillRect(-8,-5,17,11);
        g.fillStyle='#4d4738'; g.fillRect(-8,-5,17,4);
        g.fillStyle='#262219'; g.fillRect(-2,-9,5,8);   /* 꺾인 포신 */
        g.restore(); }); }
  }
  /* ---------- 색조 마무리 ----------
     예전에는 하늘색을 26% 로 전체에 덮었다. 그러면 대기감은 생기지만
     모든 색이 한꺼번에 바래서 배경이 평평해진다. 그래서 두 단계로 나눈다.
       1) multiply 로 그림자를 깊게 — 색조는 지키면서 어두운 쪽을 넓힌다
       2) 아주 옅은 하늘색 헤이즈 — 하늘과의 통일감만 남긴다
     결과: 명암 폭이 넓어지고, 배경이 캐릭터보다 한 단계 아래로 내려앉는다 */
  const TH=THEMES.find(t=>t.id===theme);
  const deep=TH.deep||'#4a5360', hazeA=TH.haze==null?.10:TH.haze;
  const deepA=(TH.deepA==null?.30:TH.deepA)*.55;   /* 조명이 깊이를 만드므로 덜 눌러도 된다 */

  /* 지면 굴곡 조명 — 평평한 색면을 굴곡 있는 땅으로 바꾼다.
     부드럽게 늘려야 하므로 이 두 장만 보간을 켠다 */
  const [shC,liC]=shadeLayers(W,H,{
    warm:TH.warm||'#ffe8bc', cool:TH.cool||deep,
    gx:TH.gx||6, amp:TH.amp, shadow:TH.shadow, light:TH.light});
  for(const c of [g,d]){
    const isDet=(c===d);
    c.save(); c.imageSmoothingEnabled=true;
    c.globalCompositeOperation=isDet?'source-atop':'multiply';
    c.drawImage(shC,0,0,W,H);                       /* 그늘 — 차가운 색 */
    c.globalCompositeOperation=isDet?'source-atop':'soft-light';
    c.globalAlpha=isDet?.55:1;
    c.drawImage(liC,0,0,W,H);                       /* 빛 — 따뜻한 색 */
    c.restore();
  }
  /* 넓은 색 변주 — 구역마다 땅빛이 조금씩 달라 보이게 */
  if(TH.tintA){
    const tn=tintLayer(W,H,TH.tintA,TH.tintB||TH.tintA,3);
    g.save(); g.imageSmoothingEnabled=true;
    g.globalCompositeOperation='soft-light'; g.globalAlpha=TH.tintQ==null?.55:TH.tintQ;
    g.drawImage(tn,0,0,W,H); g.restore();
  }
  /* base 는 빈틈이 없으므로 multiply 를 그대로 쓴다 */
  g.save();
  g.globalCompositeOperation='multiply'; g.globalAlpha=deepA;
  g.fillStyle=deep; g.fillRect(0,0,W,H);
  g.globalCompositeOperation='source-over'; g.globalAlpha=hazeA;
  g.fillStyle=TH.sky[1]; g.fillRect(0,0,W,H);
  g.restore();
  /* det 는 투명 배경이라 multiply 를 쓰면 빈 곳까지 물든다 — source-atop 으로 묶는다 */
  d.save();
  d.globalCompositeOperation='source-atop'; d.globalAlpha=deepA*.8;
  d.fillStyle=deep; d.fillRect(0,0,W,H);
  d.globalAlpha=hazeA; d.fillStyle=TH.sky[1]; d.fillRect(0,0,W,H);
  d.restore();
  return {base,det,mask,th:H,mh:TMH};
}

const BOSSES=['bomber','wing','ship','ace','zeppelin','seaplane','armortrain','fortress'];
const MIDS=['gyro','drone','crawler','miner','proto'];   /* 2편 전용 중간 보스 */
const KINGNAME='공중전함 레비아탄';
const MIDNAME={gyro:'회전익 포함 바이퍼',drone:'드론 모함 호넷',crawler:'지상 크롤러 램',
               miner:'기뢰 부설함 노바',proto:'시제 제트 스파이크'};
const MIDBOX={gyro:[54,40],drone:[56,38],crawler:[46,44],miner:[44,46],proto:[58,30]};
const BOSSBASE={overlord:1580,ship:980,fortress:1150,zeppelin:1220,armortrain:1130,seaplane:900};
function isKingStage(){ return stageNo%10===0; }          /* 10·20·30… */
function stageBossType(){ return isKingStage()?'overlord':BOSSES[(stageNo-1)%BOSSES.length]; }
function normalBossType(){ return BOSSES[(stageNo-1)%BOSSES.length]; }
function bossHpFor(type){
  return Math.round((D.bhp||1)*(BOSSBASE[type]||790)*stageFactor()*powerFactor(1));
}
const BOSSNAME={overlord:KINGNAME,bomber:'중폭격기 그라프',wing:'전익기 발키리',ship:'전함 야마시로',
                ace:'쌍동체 에이스 카이저',fortress:'공중요새 골리앗',
                zeppelin:'비행선 체펠린 IX',seaplane:'대형 비행정 알바트로스',
                armortrain:'장갑열차 크루프'};
function spawnBoss(){
  const type=stageBossType();
  const hp=bossHpFor(type);
  boss={type,x:W/2,y:-110,hp,max:hp,t:0,dir:Math.random()<.5?1:-1,
    atk:0,atkT:150,phase:0,beamT:0,aim:0,parts:[],dash:0,entering:1,itemT:110,mobT:130,
    scale:type==='overlord'?Math.min(1.55,1.20+Math.min(stageNo/10,3)*.10)
                           :Math.min(1.6,1.16+Math.min(stageNo-1,7)*.06)};

/* ==================== 피격 ==================== */
function clearNear(r){                 /* 배열을 교체하지 않고 제자리에서 제거 */
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];
    if(b&&Math.hypot(b.x-player.x,b.y-player.y)<=r) ebullets.splice(i,1);
  }
}
function hurt(d){
  if(odPhase()===1) return;        /* 변신 중에는 피해를 받지 않는다 */
  if(invT>0||state!=='play') return;
  d=d||1;
  hp-=d; sfx.hurt();
  if(hp>0){
    haptic(HAP.hurt,4);
    /* 아직 살아 있다 — 잠깐 무적 + 연기 */
    invT=64; flash=14; flashCol='255,150,90'; shake=9;
    boom(player.x,player.y,10,'#ffd27a',2.6); smoke(player.x,player.y,5);
    ring(player.x,player.y,42,'rgba(255,110,80,.7)',3,16);
    clearNear(85);
    return;
  }
  /* 격추 */
  lives--;
  power=D.pw||1; weapon=0; hp=maxHP();   /* 무기만 초기화 — 기체 등급과 누적 승급 점수는 유지 */
  bombs=D.bombs; updBomb();                           /* 폭탄 재보급 */
  wings=[];                                           /* 호위기도 잃는다 */
  invT=120; flash=44; flashCol='255,90,60'; shake=34; slowT=40;
  const dx=player.x, dy=player.y;
  if(lives>0) setBanner('격추!','강화는 유지됩니다');
  bigBoom(dx,dy,2.0,'#ffd27a');
  ring(dx,dy,170,'rgba(255,90,60,.75)',4,30);
  ring(dx,dy,250,'rgba(255,255,255,.5)',2.5,22);
  for(let k=0;k<6;k++) later(k*5,()=>{
    bigBoom(dx+rnd(-30,30),dy+rnd(-30,30),1.1+rnd(0,.5));
    if(k%2===0) sfx.pop();
  });
  smoke(dx,dy,18,'rgba(46,44,42,.65)');
  sfx.death(); haptic(HAP.death,6);
  clearNear(150);
  if(lives<=0) gameOver();
}
function useBomb(){
  if(state!=='play'||bombs<=0) return;
  if(tutOn) tutBombs++;
  bombs--; updBomb(); sfx.bomb(); haptic(HAP.bomb,5);
  flash=48; flashCol='255,250,220'; shake=22; slowT=Math.max(slowT,26);
  invT=Math.max(invT,110);

  /* 적탄이 하나씩 반짝이며 터져 사라진다 */
  const n=Math.min(ebullets.length,80);
  for(let i=0;i<n;i++){
    const b=ebullets[i];
    spark(b.x,b.y,2,'#cfeeff');
    if(i%3===0) boom(b.x,b.y,1,'#9fe0ff',1.6);
  }
  ebullets.length=0; beams.length=0;

  /* 피해 */
  const bm=1+(mods.bomb||0)*.3;
  const sb=1+Math.min(stageNo,6)*.05;          /* 스테이지 보너스는 6까지만 */
  const bp =bm*24*stageFactor()*powerFactor(D.pf||.65)*sb;
  const bpB=bm*50*stageFactor()*powerFactor(1)  *sb;
  for(const e of enemies) e.hp-=bp;
  for(const p of props) p.hp-=bp;
  if(boss) boss.hp-=bpB;

  /* 겹겹이 퍼지는 충격파 */
  ring(player.x,player.y,W*.55,'rgba(255,255,255,.95)',8,16);
  later(3,()=>ring(player.x,player.y,W*.95,'rgba(180,238,255,.9)',6,20));
  later(8,()=>ring(player.x,player.y,W*1.45,'rgba(255,222,140,.85)',5,24));
  later(14,()=>ring(player.x,player.y,W*2.0,'rgba(255,255,255,.55)',3.5,28));

  /* 발밑에서 위로 훑고 올라가는 폭발 파도 */
  for(let k=0;k<8;k++) later(k*4,()=>{
    const yy=player.y-20-k*72;
    if(yy<-60) return;
    for(let i=0;i<6;i++) boom(rnd(10,W-10),yy+rnd(-28,28),3,'#ffe6a8',3.8,1.25);
    for(let i=0;i<3;i++) boom(rnd(10,W-10),yy+rnd(-20,20),2,'#fff6d8',2.6,.9);
    ring(rnd(50,W-50),yy,66,'rgba(255,196,90,.6)',2.6,14);
    if(k%2===0) sfx.pop();
  });
  later(6,()=>{ shake=Math.max(shake,14); });
  smoke(player.x,player.y,16,'rgba(72,68,62,.5)');
}


/* ==================== 무기 ==================== */
function fire(){
  if(odPhase()){                         /* 변신 형태 — 전용 무장 */
    fireT=3.4;
    const scl=stageFactor()*powerFactor(D.pf||.65);   /* 적 체력과 같은 성장 곡선 */
    const dmB=Math.max(1.62*Math.pow(1.22,mods.dmg||0), 2.4*scl), dmg=dmB*2.6;
    for(let i=0;i<5;i++){                /* 정면 5열 중포 */
      const ox=(i-2)*11;
      bullets.push({x:player.x+ox,y:player.y-22,vx:ox*.06,vy:-17,
        dmg,type:'c',hit:{},pierce:true,pierceLeft:2,bounceLeft:0,homing:0,
        boomR:18,bs:1.35,bossMul:.22});
    }
    for(const sg of [-1,1]){             /* 좌우 유도 미사일 */
      bullets.push({x:player.x+sg*30,y:player.y-6,vx:sg*2.4,vy:-11,
        dmg:dmB*1.6,type:'v',hit:{},pierce:false,pierceLeft:0,bounceLeft:0,
        homing:3,boomR:14,bs:1.2,tgt:null,bossMul:.22});
    }
    muzzle=6; sfx.cannon();
    return;
  }
  const od=odT>0;
  const base=clamp(power,1,5)+(mods.shots||0)+(od?1:0);
  const rt=Math.pow(.88,mods.rate||0)*(od?.62:1), dm=1.62*Math.pow(1.22,mods.dmg||0);
  const y=player.y-18;
  const mk=(ang,sp,type,dmul,ox,sub)=>{
    const pc=(mods.pierce||0)+(mods.drill||0)+(type==='l'?1:0);
    bullets.push({x:player.x+(ox||0),y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
      dmg:dm*(dmul||1)*(1+.28*(mods.big||0)),type,hit:{},
      pierce:pc>0, pierceLeft:pc, bs:1+.30*(mods.big||0),
      bounceLeft:mods.bounce||0, homing:(mods.homing||0)*(sub?.45:1),
      boomR:(mods.boomst||0)*16, delay:mods.delay||0, drill:mods.drill||0,
      chain:mods.chain||0, tgt:null});
  };
  if(weapon===0){                         /* 벌컨 — 빠른 연사 부채꼴 */
    fireT=6.0*rt; const n=base, g=Math.min(.10,.34/Math.max(1,n-1));
    for(let i=0;i<n;i++) mk(-PI/2+(i-(n-1)/2)*g,13,'v',1);
    sfx.vulcan();
  } else if(weapon===1){                  /* 확산 — 넓은 산탄 */
    fireT=9.6*rt; const n=base+2, g=.155;
    for(let i=0;i<n;i++) mk(-PI/2+(i-(n-1)/2)*g,11,'p',1.3);
    sfx.plasma();
  } else if(weapon===2){                  /* 레이저 — 좁고 빠른 관통 */
    fireT=4.4*rt; const n=Math.max(1,Math.ceil(base/2));
    for(let i=0;i<n;i++) mk(-PI/2,19,'l',.85,(i-(n-1)/2)*13);
    sfx.laser();
  } else {                                /* 캐논 — 무거운 포탄 */
    fireT=17*rt; const n=Math.max(1,Math.ceil(base/2));
    for(let i=0;i<n;i++) mk(-PI/2,9.6,'c',5.4,(i-(n-1)/2)*10);
    sfx.thump();
  }
  if(mods.side){                          /* 측면 사격 */
    const n=mods.side;
    for(let i=0;i<n;i++){
      mk(0+(i-(n-1)/2)*.16,11,'v',.58,0,1);
      mk(PI+(i-(n-1)/2)*.16,11,'v',.58,0,1);
    }
  }
  if(mods.rear){                          /* 후방 사격 */
    const n=mods.rear;
    for(let i=0;i<n;i++) mk(PI/2+(i-(n-1)/2)*.22,10,'v',.55,0,1);
  }
  muzzle=4;
}
function forwardTarget(x,y){            /* 진행 방향(위쪽)에 있는 적만 */
  let bestE=null,bd=1e9;
  for(const e of enemies){
    if(e.y>y-6) continue;               /* 이미 지나친 적은 제외 */
    const d=Math.hypot(e.x-x,e.y-y);
    if(d<bd&&d<300){ bd=d; bestE=e; }
  }
  if(boss&&boss.y>-20&&boss.y<y-6){
    const d=Math.hypot(boss.x-x,boss.y-y); if(d<bd){ bd=d; bestE=boss; }
  }
  return bestE;
}
function nearestTarget(x,y){
  let bestE=null,bd=1e9;
  for(const e of enemies){ const d=Math.hypot(e.x-x,e.y-y); if(d<bd){bd=d;bestE=e;} }
  if(boss&&boss.y>-20){ const d=Math.hypot(boss.x-x,boss.y-y); if(d<bd){bd=d;bestE=boss;} }
  return bestE;
}

/* ==================== 업데이트 ==================== */
function update(dt){
  /* 안내 중에는 적이 쏘지 않는다. 그래야 아이가 마음 놓고 조작을 익힌다.
     eshot 한 곳만 막으면 새는 곳이 있어, 매 프레임 비워 확실히 막는다 */
  if(tutOn){ ebullets.length=0; invT=Math.max(invT,30); bannerT=0; tutCheck(); stageT=Math.min(stageT,60); }
  if(slowT>0){ slowT-=dt; dt*=.40; }      /* 격추·보스 격파 순간의 슬로모션 */
  if(clankT>0) clankT-=dt;
  time+=dt;
  for(let i=sched.length-1;i>=0;i--){
    const c=sched[i]; c.t-=dt;
    if(c.t<=0){ sched.splice(i,1); try{ c.fn(); }catch(e){} }
  }
  /* 구름은 화면 높이로, 지형은 '타일 높이'로 되돌아가야 한다.
     지형을 H 에서 되돌리면 타일 중간에서 그림이 통째로 튄다 */
  scFar=(scFar+.90*dt)%H;
  const _th=terrain?terrain.th:H; scGnd=(scGnd+.62*dt)%_th;
  const dr=Math.pow(.88,dt);                 /* 공기저항 — 파편마다 같은 값이라 한 번만 구한다 */
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt;
    p.vx*=dr; p.vy*=dr;
    p.life-=dt;
    if(p.life<=0){ parts[i]=parts[parts.length-1]; parts.pop(); }   /* 순서는 상관없다 */
  }
  for(let i=rings.length-1;i>=0;i--){ const r=rings[i];
    r.r+=(r.max-r.r)*.19*dt; r.life-=dt; if(r.life<=0) rings.splice(i,1); }
  for(let i=pops.length-1;i>=0;i--){ const q=pops[i];
    q.y-=.55*dt; q.life-=dt; if(q.life<=0) pops.splice(i,1); }
  if(muzzle>0) muzzle-=dt;
  if(chainT>0){ chainT-=dt; if(chainT<=0) chain=0; }
  if(flash>0) flash-=dt;
  if(shake>0) shake-=dt;
  if(bannerT>0) bannerT-=dt;

  /* 지상물은 항상 흐른다 */
  for(let i=props.length-1;i>=0;i--){
    const p=props[i]; p.y+=(p.vy||.6)*dt; p.t+=dt;
    if(state==='play'&&PROPGUN[p.kind]&&p.y>30&&p.y<H-70){
      p.fireT=(p.fireT===undefined?rnd(50,110):p.fireT)-dt;
      if(p.fireT<=0&&!bulletRoom(1)) p.fireT=40;
      else if(p.fireT<=0){
        p.fireT=Math.max(58,PROPGUN[p.kind]-stageNo*4)*D.fg;
        const a=Math.atan2(player.y-p.y,player.x-p.x);
        const sp0=2.1+Math.min(stageNo-1,6)*.07;
        if(p.kind==='warship'){
          for(let k=-1;k<=1;k++) eshot(p.x,p.y-18,a+k*.20,sp0);
        } else {
          eshot(p.x,p.y,a,sp0+.9,'tracer');
        }
        tone(215,.06,'square',.03);
      }
    }
    if(p.y>H+110) props.splice(i,1);
  }
  if(state!=='play') return;
  if(invT>0) invT-=dt;
  if(odT>0){
    const before=odT; odT-=dt;
    if(before>60&&odT<=60){               /* 해제 1초 전 경고 */
      setBanner('변신 해제','곧 원래대로'); bannerT=50;
      ring(player.x,player.y,60,'rgba(255,150,90,.8)',2.6,16); haptic(HAP.item,3);
    }
    if(before>0&&odT<=0){
      flash=18; flashCol='255,200,150'; invT=Math.max(invT,50);   /* 해제 직후 잠깐 보호 */
      ring(player.x,player.y,52,'rgba(255,255,255,.7)',2.4,16);
      smoke(player.x,player.y,10,'rgba(60,58,54,.5)');
    }
  }
  if(slowfT>0) slowfT-=dt;

  /* 이동 */
  const sp=4.4*dt;
  let mv=0;
  if(keys.ArrowLeft){player.x-=sp;mv=-1;} if(keys.ArrowRight){player.x+=sp;mv=1;}
  if(keys.ArrowUp) player.y-=sp; if(keys.ArrowDown) player.y+=sp;
  if(mv) player.roll=clamp(player.roll+mv*.09*dt,-1,1);
  player.roll*= Math.pow(.88,dt);
  player.x=clamp(player.x,18,W-18); player.y=clamp(player.y,44,H-28);

  checkTier();
  if(hp<=maxHP()*.4&&Math.random()<.35*dt)
    smoke(player.x+rnd(-6,6),player.y+14,1,'rgba(70,70,70,.5)');
  fireT-=dt; if(fireT<=0) fire();
  updateWings(dt);
  if(mods.orbit){                          /* 회전탄 */
    const n=mods.orbit, R=52, od=1.62*Math.pow(1.22,mods.dmg||0)*1.7;
    for(let i=0;i<n;i++){
      const a=time*.052+i*TAU/n, ox=player.x+Math.cos(a)*R, oy=player.y+Math.sin(a)*R;
      for(const e of enemies){
        if(Math.hypot(e.x-ox,e.y-oy)<e.r+9){
          if(!orbHit[e.id]||time-orbHit[e.id]>16){
            orbHit[e.id]=time; e.hp-=od; e.hit=5; spark(ox,oy,3,'#ffd27a');
          }
        }
      }
      if(boss){ const bb=bossBox();
        if(Math.abs(boss.x-ox)<bb[0]&&Math.abs(boss.y-oy)<bb[1]&&(!orbHit.B||time-orbHit.B>16)){
          orbHit.B=time; boss.hp-=od; spark(ox,oy,3,'#ffd27a'); } }
    }
  }
  for(let i=zaps.length-1;i>=0;i--){ zaps[i].life-=dt; if(zaps[i].life<=0) zaps.splice(i,1); }
  for(let i=wrecks.length-1;i>=0;i--){
    const w=wrecks[i]; w.x+=w.vx*dt; w.y+=w.vy*dt; w.vy+=.06*dt;
    w.rot+=w.spin*dt; w.life-=dt;
    if(w.life<=0){                       /* 튕겨나간 자리에서 터진다 */
      bigBoom(w.x,w.y,w.r>18?1.4:w.el?1.15:.8,w.el?'#ffd24a':'#ffd58a');
      wrecks.splice(i,1);
    }
  }
  if(mkT>0){
    mkT-=dt;
    if(mkT<=0&&mkN>=3) multiKill(mkN,mkX,mkY);
  }


  /* 스테이지 진행 */
  if(!boss&&bossWarn<=0){
    stageT+=dt; spawnT-=dt;
    if(spawnT<=0) spawnWave();
    if(Math.random()<.008*dt) spawnProp();

  for(let i=bullets.length-1;i>=0;i--){

        const a=Math.atan2(b.tgt.y-b.y,b.tgt.x-b.x), ca=Math.atan2(b.vy,b.vx);

      if(b.hl<=0&&b.vy>-2){                /* 유도가 끝나면 위로 정렬해 화면 밖으로 */

  /* 지상물 파괴 */
  for(let i=props.length-1;i>=0;i--){
    const p=props[i]; if(!p) continue;
    if(p.hp<=0){ addScore(p.sc); addExp(((PROPDEF[p.kind]||PROPDEF.tank).sc)/100); sfx.boom(); shake=Math.max(shake,10);
      bigBoom(p.x,p.y,1.8,'#ffe2a0'); ring(p.x,p.y,110,'rgba(255,180,90,.5)',2.5,26);

    }
  }

  /* 적기 */
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i]; if(!e) continue; e.t+=dt; if(e.hit>0) e.hit-=dt;

  /* 아이템 */
  for(let i=items.length-1;i>=0;i--){

        if(power<5){ power++;

      }
